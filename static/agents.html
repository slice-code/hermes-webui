<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pemantau Agent — Hermes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1115'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%237aa2f7'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --bg2:#161a21; --bg3:#1d222b; --line:#262c37;
    --fg:#e6e9ef; --dim:#8b93a1; --acc:#7aa2f7; --acc2:#bb9af7;
    --ok:#9ece6a; --warn:#e0af68; --err:#f7768e; --radius:12px;
  }
  *{box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#333d52 transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:#2c3549;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
  :focus-visible{outline:2px solid var(--acc); outline-offset:1px}
  ::selection{background:#33517f; color:#fff}
  body{
    margin:0; background:var(--bg); color:var(--fg); overflow-x:clip;
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  #agent-monitor{display:block}

  /* ---------- kepala lengket ---------- */
  /* Satu kontainer lengket untuk KEDUA baris (.top + .bar). Kalau keduanya
     masing-masing `position:sticky; top:0`, saat digulir mereka bertumpuk di
     y=0 dan baris judul (z-index lebih tinggi) menutupi dropdown board +
     indikator "diperbarui N dtk lalu" — pemilih board jadi tidak bisa dilihat
     maupun diketuk justru saat daftar task sedang digulir. */
  .head{
    position:sticky; top:0; z-index:6; background:var(--bg2);
    border-bottom:1px solid var(--line);
  }
  .top{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:9px 12px; background:var(--bg2); border-bottom:1px solid var(--line);
  }
  .top h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.01em; white-space:nowrap}
  .spacer{flex:1}
  .back{
    font-size:12.5px; color:var(--fg); background:var(--bg3); border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; text-decoration:none; white-space:nowrap; min-height:34px;
    display:inline-flex; align-items:center;
  }
  .back:hover{border-color:var(--acc); color:#fff}
  .icon{
    font:inherit; font-size:15px; line-height:1; color:var(--fg); background:var(--bg3);
    border:1px solid var(--line); border-radius:8px; width:38px; height:38px; cursor:pointer;
  }
  .icon:hover{border-color:var(--acc); color:#fff}
  .icon.busy{opacity:.5}

  .bar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 12px; background:var(--bg2);
  }
  .bar .lb{font-size:11.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em}
  select{
    flex:1; min-width:0; max-width:100%; font:inherit; font-size:13.5px; color:var(--fg);
    background:var(--bg3); border:1px solid var(--line); border-radius:9px; padding:9px 10px;
    min-height:40px;
  }
  select:focus{border-color:var(--acc)}
  .live{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); min-width:0}
  .live #updated{white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--ok)} .dot.off{background:var(--err)}

  /* ---------- chip ringkasan / filter ---------- */
  .chips{display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px 2px}
  .chip{
    display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:6px 11px;
    font:13px/1 inherit; color:var(--dim); background:var(--bg3);
    border:1px solid var(--line); border-radius:999px; cursor:pointer;
  }
  .chip b{color:var(--fg); font-weight:600}
  .chip:hover{border-color:var(--acc); color:var(--fg)}
  .chip[aria-pressed="true"]{background:#1b2740; border-color:var(--acc); color:#fff}
  .swatch{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim)}

  .errbar{
    margin:8px 12px 0; padding:9px 11px; border:1px solid var(--err); border-radius:9px;
    background:#241419; color:#ffc9d2; font-size:12.5px; overflow-wrap:anywhere;
  }

  /* ---------- daftar task ---------- */
  main{padding:10px 12px 28px}
  .list{display:flex; flex-direction:column; gap:9px; max-width:760px; margin:0 auto}
  .card{
    display:block; width:100%; text-align:left; font:inherit; color:var(--fg);
    background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 12px; min-height:56px; cursor:pointer;
  }
  .card:hover{border-color:var(--acc)}
  .card.top-run{border-color:#2f4667; background:#141b26}
  .crow{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
    padding:3px 8px; border-radius:999px; border:1px solid var(--line); background:var(--bg3);
    color:var(--dim); white-space:nowrap;
  }
  .badge.running{color:#cfe0ff; border-color:#33517f; background:#1b2740}
  .badge.ready{color:#dff3c9; border-color:#3d5a2a; background:#1c2717}
  .badge.todo{color:#c8cfdb; border-color:#333b48; background:#1a1f28}
  .badge.blocked{color:#ffd0d8; border-color:#6d2b39; background:#2a161c}
  .badge.review{color:#f6e3c4; border-color:#5c4a22; background:#25200f}
  .badge.done{color:#c9e2b4; border-color:#34502a; background:#182115}
  .badge.archived{color:var(--dim)}
  .pulse{
    width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.7)}}
  .who{font:12px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--acc2); overflow-wrap:anywhere}
  .when{font-size:11.5px; color:var(--dim); margin-left:auto; white-space:nowrap}
  .ttl{
    margin-top:7px; font-size:14.5px; line-height:1.4; overflow-wrap:anywhere;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .sub{margin-top:6px; font-size:11.5px; color:var(--dim); overflow-wrap:anywhere}
  .sub .warn{color:var(--warn)} .sub .bad{color:var(--err)} .sub .good{color:var(--ok)}

  .empty{
    color:var(--dim); text-align:center; padding:16vh 12px 0; font-size:14px; overflow-wrap:anywhere;
  }
  .empty b{color:var(--fg); display:block; margin-bottom:6px; font-size:15px}

  /* ---------- panel detail ---------- */
  .sheetWrap{position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center}
  .sheetWrap[hidden]{display:none}
  .sheetBg{position:absolute; inset:0; background:#000a}
  .sheet{
    position:relative; width:100%; max-width:760px; max-height:86vh; display:flex; flex-direction:column;
    background:var(--bg2); border:1px solid var(--line); border-bottom:none;
    border-radius:14px 14px 0 0; box-shadow:0 -14px 40px #0009;
  }
  .sheet header{
    display:flex; align-items:flex-start; gap:10px; padding:11px 13px; border-bottom:1px solid var(--line);
  }
  .sheet h2{margin:0; font-size:14.5px; line-height:1.4; overflow-wrap:anywhere; min-width:0; flex:1}
  .sheet .shBody{overflow-y:auto; padding:12px 13px 22px; overflow-wrap:anywhere}
  .sec{margin:0 0 14px}
  .sec h3{
    margin:0 0 6px; font:11.5px/1 inherit; text-transform:uppercase; letter-spacing:.07em; color:var(--dim);
  }
  .kv{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px}
  .kv .k{color:var(--dim)}
  .mono{
    font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; background:#0c0f14;
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; overflow-wrap:anywhere;
  }
  .pathrow{display:flex; gap:7px; align-items:flex-start; flex-wrap:wrap}
  .pathrow .mono{flex:1; min-width:180px}
  .copy{
    font:12px ui-monospace,monospace; padding:7px 10px; min-height:36px; color:var(--fg);
    background:var(--bg3); border:1px solid var(--line); border-radius:8px; cursor:pointer;
  }
  .copy:hover{border-color:var(--acc); color:#fff}
  pre.body{
    margin:0; padding:10px 11px; background:#0c0f14; border:1px solid var(--line); border-radius:9px;
    font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap; overflow-wrap:anywhere; max-height:46vh; overflow-y:auto;
  }
  .cmt{border-left:2px solid var(--line); padding:0 0 0 9px; margin:0 0 10px}
  .cmt .h{font-size:11.5px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap}
  .cmt .h b{color:var(--acc2); font-weight:600}
  .cmt .b{font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; margin-top:3px}
  .ev{font:12px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim); padding:3px 0; overflow-wrap:anywhere}
  .ev b{color:var(--fg); font-weight:600}
  .ids{font:12.5px ui-monospace,monospace; color:var(--acc); text-decoration:none; overflow-wrap:anywhere}
  .muted{color:var(--dim); font-size:12.5px}
  a{color:var(--acc)}
</style>
</head>
<body>
<div id="agent-monitor">
  <div class="head">
    <header class="top">
      <h1>Pemantau Agent</h1>
      <span class="spacer"></span>
      <a class="back" href="/" title="Kembali ke halaman chat">← Kembali ke chat</a>
      <button class="icon" id="refresh" aria-label="Muat ulang sekarang" title="Muat ulang sekarang">⟳</button>
    </header>

    <div class="bar">
      <label class="lb" for="boardSel">Board</label>
      <select id="boardSel" aria-label="Pilih papan kanban"></select>
      <span class="live" aria-live="polite">
        <span class="dot" id="dot" aria-hidden="true"></span>
        <span id="updated">memuat…</span>
      </span>
    </div>
  </div>

  <div class="chips" id="chips" role="group" aria-label="Ringkasan &amp; filter status"></div>
  <div id="errbar"></div>

  <main id="main">
    <div class="list" id="list"></div>
  </main>
</div>

<div class="sheetWrap" id="sheetWrap" hidden>
  <div class="sheetBg" id="sheetBg"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header>
      <h2 id="sheetTitle">Detail task</h2>
      <button class="copy" id="sheetClose" aria-label="Tutup detail">Tutup ✕</button>
    </header>
    <div class="shBody" id="sheetBody"></div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // Sesi login bisa kedaluwarsa/dicabut di server: setiap 401 dari proxy berarti
  // cookie sudah tidak sah — lempar ke halaman login, jangan tampilkan error mentah.
  const _fetch = window.fetch.bind(window);
  window.fetch = (input, init) => _fetch(input, init).then((res) => {
    if (res.status === 401) {
      location.replace("/login?next=" + encodeURIComponent(location.pathname + location.search));
    }
    return res;
  });

  const $ = (id) => document.getElementById(id);
  const LS = "hermes-agents-v1";
  const REFRESH_MS = 10000;                 // auto-refresh; berhenti saat tab tidak aktif
  const STATUS = {
    running:  { label: "Berjalan", cls: "running" },
    ready:    { label: "Siap",     cls: "ready" },
    todo:     { label: "Menunggu", cls: "todo" },
    blocked:  { label: "Terhenti", cls: "blocked" },
    review:   { label: "Ditinjau", cls: "review" },
    done:     { label: "Selesai",  cls: "done" },
    archived: { label: "Arsip",    cls: "archived" },
  };
  const CORE_CHIPS = ["running", "ready", "todo", "blocked", "done"];
  const SWATCH = {
    running: "#7aa2f7", ready: "#9ece6a", todo: "#8b93a1",
    blocked: "#f7768e", review: "#e0af68", done: "#6f9f4f", archived: "#5b6472",
  };

  const state = { slug: "", boards: [], counts: {}, tasks: [], filter: null,
                  updatedAt: 0, error: "", busy: false, chipEls: null, chipNote: null };
  let lastFocus = null;

  // ---------------- util ----------------
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  };
  const statusInfo = (s) => STATUS[s] || { label: s || "?", cls: "" };

  function rel(ts) {
    if (!ts) return "";
    const secs = Math.floor(Date.now() / 1000 - Number(ts));
    if (!isFinite(secs)) return "";
    if (secs < 5) return "baru saja";
    if (secs < 60) return secs + " dtk lalu";
    if (secs < 3600) return Math.floor(secs / 60) + " mnt lalu";
    if (secs < 86400) return Math.floor(secs / 3600) + " jam lalu";
    return Math.floor(secs / 86400) + " hari lalu";
  }

  const activityAt = (t) =>
    (t.last_event && t.last_event.created_at) || t.last_heartbeat_at || t.started_at || t.created_at;

  async function copyText(text, button) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
        document.body.appendChild(ta);
        ta.select();
        ok = document.execCommand("copy");
        ta.remove();
      } catch { ok = false; }
    }
    if (button) {
      button.textContent = ok ? "Tersalin ✓" : "Gagal menyalin";
      setTimeout(() => { button.textContent = "Salin"; }, 1500);
    }
  }

  // ---------------- data ----------------
  async function loadBoards() {
    const res = await fetch("/api/agents/boards", { cache: "no-store" });
    const data = await res.json().catch(() => null);
    if (!res.ok || !Array.isArray(data)) {
      throw new Error((data && (data.detail || data.error)) || ("HTTP " + res.status));
    }
    state.boards = data;
    const saved = readSaved();
    const usable = state.boards.filter((b) => b.slug === saved);
    const running = state.boards.filter((b) => b.running_count > 0);
    const pick = usable[0] || state.boards.find((b) => b.current) || running[0] ||
                 state.boards.find((b) => b.task_count > 0) || state.boards[0];
    state.slug = pick ? pick.slug : "";
    localStorage.setItem(LS, state.slug);
    renderBoards();
  }

  function readSaved() {
    try { return String(localStorage.getItem(LS) || ""); } catch { return ""; }
  }

  async function loadBoard() {
    if (!state.slug) {                       // tidak ada board sama sekali: bukan error,
      state.updatedAt = Math.floor(Date.now() / 1000);   // tapi indikator tetap jujur
      return;
    }
    state.busy = true;
    $("refresh").classList.add("busy");
    const res = await fetch("/api/agents/boards", { cache: "no-store" }).catch(() => null);
    if (res && res.ok) {
      const boards = await res.json().catch(() => null);
      if (Array.isArray(boards)) renderBoardOptions(boards);
    }
    const r = await fetch("/api/agents/board?slug=" + encodeURIComponent(state.slug) + "&limit=200",
                          { cache: "no-store" });
    const data = await r.json().catch(() => null);
    state.busy = false;
    $("refresh").classList.remove("busy");
    if (!r.ok || !data || !data.tasks) {
      throw new Error((data && (data.detail || data.error)) || ("HTTP " + r.status));
    }
    state.counts = data.counts || {};
    state.tasks = data.tasks || [];
    state.updatedAt = data.generated_at || Math.floor(Date.now() / 1000);
    state.error = "";
    renderChips();
    renderTasks();
  }

  async function refresh(manual) {
    if (state.busy && !manual) return;
    try {
      if (!state.boards.length) await loadBoards();
      await loadBoard();
      // Urutan penting: baris "memuat" di atas WAJIB hilang begitu satu refresh
      // berhasil (state.error sudah ""), kalau tidak banner merah bertahan
      // selamanya sementara data & titik status sudah hijau lagi.
      paintError();
      paintUpdated();
    } catch (e) {
      state.error = "Gagal memuat data papan: " + (e && e.message ? e.message : String(e));
      paintError();
    }
  }

  // ---------------- render ----------------
  function paintUpdated() {
    const age = state.updatedAt ? Math.max(0, Math.floor(Date.now() / 1000) - state.updatedAt) : 0;
    $("dot").className = "dot on";
    $("updated").textContent = state.updatedAt ? "diperbarui " + age + " dtk lalu" : "memuat…";
  }

  function paintError() {
    const box = $("errbar");
    box.innerHTML = "";
    if (!state.error) return;
    $("dot").className = "dot off";
    const line = el("div", "errbar", "⚠ " + state.error);
    box.appendChild(line);
    if (state.updatedAt) {
      $("updated").textContent = "gagal menyegarkan · data " +
        Math.max(0, Math.floor(Date.now() / 1000) - state.updatedAt) + " dtk lalu";
    } else {
      $("updated").textContent = "gagal memuat";
    }
  }

  function boardOptionLabel(b) {
    const bits = [b.name || b.slug];
    if (b.running_count > 0) bits.push("• " + b.running_count + " jalan");
    return bits.join(" — ");
  }

  function renderBoards() {
    const sel = $("boardSel");
    sel.innerHTML = "";
    for (const b of state.boards) {
      const opt = el("option", null, boardOptionLabel(b));
      opt.value = b.slug;
      if (b.slug === state.slug) opt.selected = true;
      sel.appendChild(opt);
    }
    const current = state.boards.filter((b) => b.slug === state.slug)[0];
    sel.setAttribute("aria-label", "Pilih papan kanban (sekarang: " + (current ? current.name : "-") + ")");
  }

  function renderBoardOptions(boards) {
    state.boards = boards;
    renderBoards();
  }

  function chipKeys() {
    const keys = CORE_CHIPS.slice();
    for (const key of Object.keys(state.counts)) {
      if (key === "total" || key === "archived" || keys.includes(key)) continue;
      if (Number(state.counts[key]) > 0) keys.push(key);
    }
    return keys;
  }

  // Chip dibangun ulang hanya kalau daftar statusnya berubah. Saat angka berubah
  // (auto-refresh) atau filter dipasang/dilepas, elemennya dipakai ulang supaya
  // fokus keyboard tidak hilang di tengah interaksi.
  function renderChips() {
    const box = $("chips");
    const keys = chipKeys();
    let known = state.chipEls || {};
    const same = keys.length === Object.keys(known).length && keys.every((k) => known[k]);
    if (!same) {
      box.innerHTML = "";
      known = {};
      for (const key of keys) {
        const info = statusInfo(key);
        const chip = el("button", "chip");
        chip.type = "button";
        const sw = el("span", "swatch");
        sw.style.background = SWATCH[key] || "#8b93a1";
        chip.appendChild(sw);
        chip.appendChild(el("span", null, info.label + " "));
        const num = el("b", null, "0");
        chip.appendChild(num);
        chip.onclick = () => {
          state.filter = state.filter === key ? null : key;
          paintChips();
          renderTasks();
        };
        box.appendChild(chip);
        known[key] = { chip: chip, num: num, info: info };
      }
      state.chipEls = known;
      box.appendChild(el("div", "muted")).style.margin = "6px 0 0";
    }
    state.chipNote = box.lastElementChild;
    paintChips();
  }

  function paintChips() {
    for (const key of Object.keys(state.chipEls || {})) {
      const entry = state.chipEls[key];
      entry.num.textContent = String(Number(state.counts[key] || 0));
      entry.chip.setAttribute("aria-pressed", state.filter === key ? "true" : "false");
      entry.chip.setAttribute("aria-label",
        "Filter status " + entry.info.label + ", " + Number(state.counts[key] || 0) + " task" +
        (state.filter === key ? " (aktif — ketuk untuk melepas)" : ""));
      entry.chip.title = "Filter status " + entry.info.label +
        (state.filter === key ? " (ketuk lagi untuk melepas)" : "");
    }
    if (state.chipNote) {
      const total = Number(state.counts.total || 0);
      const archived = Number(state.counts.archived || 0);
      state.chipNote.textContent = total + " task" +
        (archived ? " (" + archived + " arsip tidak ditampilkan)" : "");
    }
  }

  function subTokens(task) {
    const toks = [];
    if (task.status === "running") {
      toks.push({ text: "PID " + (task.worker_pid || "-") + " ", cls: "" });
      toks.push({ text: task.worker_alive ? "hidup" : "tidak ditemukan",
                  cls: task.worker_alive ? "good" : "bad" });
      if (task.last_heartbeat_at) toks.push({ text: "heartbeat " + rel(task.last_heartbeat_at), cls: "" });
    } else if (task.status === "blocked") {
      toks.push({ text: "menunggu tindakan" + (task.block_kind ? " · " + task.block_kind : ""), cls: "warn" });
    } else {
      if (task.last_event) toks.push({ text: "terakhir: " + task.last_event.kind, cls: "" });
      if (task.status === "done" && task.completed_at) {
        toks.push({ text: "selesai " + rel(task.completed_at), cls: "" });
      }
    }
    if (task.comment_count) toks.push({ text: task.comment_count + " komentar", cls: "" });
    if (task.children && task.children.length) {
      toks.push({ text: task.children.length + " lanjutan", cls: "" });
    }
    return toks;
  }

  function taskCard(task) {
    const card = el("button", "card" + (task.status === "running" ? " top-run" : ""));
    card.type = "button";
    card.setAttribute("aria-label",
      "Task " + task.title + ", status " + statusInfo(task.status).label +
      (task.assignee ? ", agent " + task.assignee : "") + ", " + rel(activityAt(task)));

    const row = el("div", "crow");
    const badge = el("span", "badge " + statusInfo(task.status).cls);
    if (task.status === "running") badge.appendChild(el("span", "pulse"));
    badge.appendChild(el("span", null, statusInfo(task.status).label));
    row.appendChild(badge);
    if (task.assignee) row.appendChild(el("span", "who", task.assignee));
    row.appendChild(el("span", "when", rel(activityAt(task))));
    card.appendChild(row);

    card.appendChild(el("div", "ttl", task.title || "(tanpa judul)"));

    const sub = el("div", "sub");
    const toks = subTokens(task);
    toks.forEach((tok, i) => {
      if (i) sub.appendChild(document.createTextNode(" · "));
      sub.appendChild(tok.cls ? el("span", tok.cls, tok.text) : document.createTextNode(tok.text));
    });
    card.appendChild(sub);

    card.onclick = () => openDetail(task, card);
    return card;
  }

  function renderTasks() {
    const list = $("list");
    list.innerHTML = "";
    if (!state.boards.length) {
      const empty = el("div", "empty");
      empty.appendChild(el("b", null, "Belum ada board kanban"));
      empty.appendChild(el("div", null, "Buat papan dulu lewat `hermes kanban boards create <slug>`."));
      list.appendChild(empty);
      return;
    }
    const visible = state.filter ? state.tasks.filter((t) => t.status === state.filter) : state.tasks;
    if (!visible.length) {
      const empty = el("div", "empty");
      if (state.filter) {
        empty.appendChild(el("b", null, "Tidak ada task berstatus " + statusInfo(state.filter).label));
        empty.appendChild(el("div", null, "Ketuk chip yang sama lagi untuk melepas filter."));
      } else {
        empty.appendChild(el("b", null, "Belum ada task di board ini"));
        empty.appendChild(el("div", null, "Task yang dibuat agent akan muncul di sini otomatis."));
      }
      list.appendChild(empty);
      return;
    }
    const frag = document.createDocumentFragment();
    for (const task of visible) frag.appendChild(taskCard(task));
    list.appendChild(frag);
  }

  // ---------------- panel detail ----------------
  function kv(pairs) {
    const box = el("div", "kv");
    for (const [k, v] of pairs) {
      if (v === undefined || v === null || v === "") continue;
      const item = el("span");
      item.appendChild(el("span", "k", k + ": "));
      item.appendChild(el("span", null, String(v)));
      box.appendChild(item);
    }
    return box;
  }

  function section(title) {
    const sec = el("div", "sec");
    sec.appendChild(el("h3", null, title));
    return sec;
  }

  function pathRow(path) {
    const wrap = el("div", "pathrow");
    wrap.appendChild(el("div", "mono", path));
    const btn = el("button", "copy", "Salin");
    btn.type = "button";
    btn.setAttribute("aria-label", "Salin path workspace");
    btn.onclick = () => copyText(path, btn);
    wrap.appendChild(btn);
    return wrap;
  }

  function renderDetail(task, extra) {
    const body = $("sheetBody");
    body.innerHTML = "";
    $("sheetTitle").textContent = task.title || "(tanpa judul)";

    const s1 = section("Status");
    s1.appendChild(kv([
      ["Status", statusInfo(task.status).label],
      ["Agent", task.assignee || "-"],
      ["ID", task.id],
      ["Prioritas", task.priority || 0],
      ["Dibuat", rel(task.created_at)],
      ["Mulai", task.started_at ? rel(task.started_at) : ""],
      ["Selesai", task.completed_at ? rel(task.completed_at) : ""],
    ]));
    if (task.status === "running") {
      s1.appendChild(kv([
        ["Worker", "PID " + (task.worker_pid || "-") + (task.worker_alive ? " (hidup)" : " (tidak ditemukan)")],
        ["Heartbeat", task.last_heartbeat_at ? rel(task.last_heartbeat_at) : ""],
      ]));
    }
    if (task.block_kind) s1.appendChild(kv([["Menunggu", task.block_kind]]));
    if (task.last_failure_error) {
      const fail = el("div", "mono");
      fail.textContent = task.last_failure_error;
      s1.appendChild(fail);
    }
    body.appendChild(s1);

    if (task.workspace_path) {
      const s2 = section("Workspace");
      s2.appendChild(pathRow(task.workspace_path));
      s2.appendChild(el("div", "muted", "jenis: " + (task.workspace_kind || "-")));
      body.appendChild(s2);
    }

    const s3 = section("Ringkasan");
    const detailTask = extra && extra.task ? extra.task : null;
    const preview = detailTask ? (detailTask.body || "") : (task.body_preview || "");
    const pre = el("pre", "body", preview || "(body kosong)");
    s3.appendChild(pre);
    if (detailTask && detailTask.body_truncated) {
      s3.appendChild(el("div", "muted", "Body task dipotong di sini."));
    } else if (!detailTask && task.body_truncated) {
      s3.appendChild(el("div", "muted", "Ringkasan dipotong — body penuh menyusul di bawah."));
    }
    body.appendChild(s3);

    if (extra && extra.task) {
      const detail = extra.task;

      const sc = section("Komentar terakhir (" + (detail.comment_count || 0) + " total)");
      if (!detail.comments || !detail.comments.length) {
        sc.appendChild(el("div", "muted", "Belum ada komentar di task ini."));
      } else {
        for (const c of detail.comments) {
          const box = el("div", "cmt");
          const head = el("div", "h");
          head.appendChild(el("b", null, c.author || "-"));
          head.appendChild(el("span", null, rel(c.created_at)));
          box.appendChild(head);
          box.appendChild(el("div", "b", c.body || ""));
          sc.appendChild(box);
        }
      }
      body.appendChild(sc);

      const se = section("Event terakhir");
      if (!detail.events || !detail.events.length) {
        se.appendChild(el("div", "muted", "Belum ada event."));
      } else {
        for (const ev of detail.events.slice(-8).reverse()) {
          const line = el("div", "ev");
          line.appendChild(el("b", null, ev.kind || "-"));
          line.appendChild(document.createTextNode(" · " + rel(ev.created_at)));
          if (ev.payload_preview) line.appendChild(document.createTextNode(" · " + ev.payload_preview));
          se.appendChild(line);
        }
      }
      body.appendChild(se);

      if (detail.runs && detail.runs.length) {
        const sr = section("Run worker");
        for (const run of detail.runs) {
          const line = el("div", "ev");
          line.appendChild(el("b", null, "run #" + run.id + " " + (run.status || "")));
          line.appendChild(document.createTextNode(
            " · " + (run.profile || "-") + (run.outcome ? " · " + run.outcome : "") +
            " · mulai " + rel(run.started_at)));
          sr.appendChild(line);
        }
        body.appendChild(sr);
      }
    } else {
      const sl = section("Memuat…");
      sl.appendChild(el("div", "muted", "Mengambil body penuh, komentar, dan event…"));
      body.appendChild(sl);
    }

    const sr2 = section("Hubungan task");
    const linked = el("div", "kv");
    linked.appendChild(el("span", null, "induk: " + ((task.parents || []).join(", ") || "-")));
    linked.appendChild(el("span", null, "lanjutan: " + ((task.children || []).join(", ") || "-")));
    sr2.appendChild(linked);
    body.appendChild(sr2);
  }

  async function openDetail(task, trigger) {
    lastFocus = trigger || null;
    $("sheetWrap").hidden = false;
    renderDetail(task, null);
    $("sheetClose").focus();
    try {
      const r = await fetch("/api/agents/task?slug=" + encodeURIComponent(state.slug) +
                            "&id=" + encodeURIComponent(task.id), { cache: "no-store" });
      const data = await r.json().catch(() => null);
      if (r.ok && data && data.task) renderDetail(data.task, data);
      else throw new Error((data && (data.detail || data.error)) || ("HTTP " + r.status));
    } catch (e) {
      const s = section("Gagal memuat detail");
      s.appendChild(el("div", "muted", String(e && e.message ? e.message : e)));
      $("sheetBody").appendChild(s);
    }
  }

  function closeDetail() {
    $("sheetWrap").hidden = true;
    $("sheetBody").innerHTML = "";
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  // ---------------- interaksi ----------------
  $("refresh").onclick = () => refresh(true);
  $("sheetClose").onclick = closeDetail;
  $("sheetBg").onclick = closeDetail;
  $("boardSel").onchange = (e) => {
    state.slug = e.target.value;
    state.filter = null;
    try { localStorage.setItem(LS, state.slug); } catch {}
    refresh(true);
  };
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("sheetWrap").hidden) closeDetail();
  });

  // Auto-refresh 10 detik, tapi hanya saat tab terlihat; begitu tab kembali aktif
  // langsung disegarkan sekali supaya angka yang tampil tidak tertinggal.
  setInterval(() => { if (!document.hidden) refresh(false); }, REFRESH_MS);
  setInterval(() => { if (!document.hidden && !state.error) paintUpdated(); }, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(true); });

  refresh(true);
})();
</script>
</body>
</html>
