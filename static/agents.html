<script>
(() => {
  "use strict";

  // Sesi login bisa kedaluwarsa/dicabut di server: setiap 401 berarti cookie
  // sudah tidak sah — lempar ke halaman login, jangan tampilkan error mentah.
  const _fetch = window.fetch.bind(window);
  window.fetch = (input, init) => _fetch(input, init).then((res) => {
    if (res.status === 401) {
      location.replace("/login?next=" + encodeURIComponent(location.pathname + location.search));
    }
    return res;
  });

  const $ = (id) => document.getElementById(id);
  const LS_BOARD = "hermes-agents-v1";
  const LS_COLS = "hermes-agents-cols-v2";
  const LS_FILT = "hermes-agents-filter-v2";
  const REFRESH_MS = 10000;
  const STATUS = {
    triage:   { label: "Triage",   color: "#bb9af7" },
    todo:     { label: "Todo",     color: "#8b93a1" },
    ready:    { label: "Ready",    color: "#9ece6a" },
    running:  { label: "Running",  color: "#7aa2f7" },
    review:   { label: "Review",   color: "#e0af68" },
    blocked:  { label: "Blocked",  color: "#f7768e" },
    done:     { label: "Done",     color: "#6f9f4f" },
    archived: { label: "Arsip",    color: "#5b6472" },
    scheduled:{ label: "Scheduled",color: "#7dcfff" },
  };
  const COLUMNS = ["triage", "todo", "ready", "running", "review", "blocked", "done"];
  const CORE_CHIPS = ["running", "ready", "todo", "blocked", "review", "done", "triage"];
  const PRIORITY_LABEL = ["P0", "P1", "P2", "P3", "P4", "P5"];
  const NARROW_HIDDEN = ["triage", "done"];     // default kolom tersembunyi di layar sempit

  const state = {
    slug: "", boards: [], counts: {}, tasks: [], filter: null,
    updatedAt: 0, error: "", busy: false, loaded: false, mutating: 0,
    assignees: [], assigneeNote: "", chipEls: null,
    dragId: "", detailId: "", detail: null, freshId: "", lastFocus: null,
    compact: false, cols: { wide: null, narrow: null },
    q: "", who: "", prio: "", runningOnly: false,
  };
  let toastTimer = null;
  let menuEl = null;

  // ---------------- util ----------------
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  };
  const statusInfo = (s) => STATUS[s] || { label: s || "?", color: "#8b93a1" };
  const label = (s) => statusInfo(s).label;

  function rel(ts) {
    if (!ts) return "";
    const secs = Math.floor(Date.now() / 1000 - Number(ts));
    if (!isFinite(secs)) return "";
    if (secs < 5) return "baru saja";
    if (secs < 60) return secs + " dtk lalu";
    if (secs < 3600) return Math.floor(secs / 60) + " mnt lalu";
    if (secs < 86400) return Math.floor(secs / 3600) + " jam lalu";
    return Math.floor(secs / 86400) + " hari lalu";
  }
  const activityAt = (t) =>
    (t.last_event && t.last_event.created_at) || t.last_heartbeat_at || t.started_at || t.created_at;

  function initials(who) {
    const parts = String(who || "").split(/[\s._-]+/).filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2);
    return (parts[0][0] + parts[1][0]);
  }

  function lsGet(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch { return fallback; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }

  // ---------------- toast (+ aksi urungkan) ----------------
  function toast(text, kind, opts) {
    opts = opts || {};
    const box = $("toast");
    const act = $("toastAct");
    $("toastText").textContent = text;
    box.hidden = false;
    box.className = kind === "err" ? "err" : "";
    if (opts.action) {
      act.hidden = false;
      act.disabled = false;
      act.textContent = opts.action.label;
      act.onclick = async () => {
        act.disabled = true;
        act.textContent = "Mengembalikan…";
        // act() menampilkan toast hasilnya sendiri — jangan sembunyikan setelah itu.
        await opts.action.run();
      };
    } else {
      act.hidden = true;
      act.onclick = null;
      act.disabled = false;
    }
    clearTimeout(toastTimer);
    const life = opts.action ? 12000 : (kind === "err" ? 9000 : 5000);
    toastTimer = setTimeout(() => { box.hidden = true; }, life);
  }

  async function copyText(text, button) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
        document.body.appendChild(ta); ta.select();
        ok = document.execCommand("copy"); ta.remove();
      } catch { ok = false; }
    }
    if (button) {
      const orig = button.dataset.orig || button.textContent;
      button.dataset.orig = orig;
      button.textContent = ok ? "Tersalin ✓" : "Gagal menyalin";
      setTimeout(() => { button.textContent = orig; }, 1500);
    }
    return ok;
  }

  // ---------------- modal internal ----------------
  // Semua dialog dibuat sendiri (bukan confirm()/prompt()) supaya gaya konsisten,
  // bisa memuat beberapa field sekaligus, dan hasilnya bisa divalidasi server.
  function ask(opts) {
    return new Promise((resolve) => {
      const wrap = el("div", "modalWrap");
      const bg = el("div", "modalBg");
      const box = el("div", "modal");
      box.setAttribute("role", "dialog");
      box.setAttribute("aria-modal", "true");
      box.setAttribute("aria-labelledby", "modalTitle");

      const form = el("form");
      const h = el("h2", null, opts.title || "Konfirmasi");
      h.id = "modalTitle";
      form.appendChild(h);
      if (opts.intro) form.appendChild(el("p", "intro", opts.intro));
      const errBox = el("div", "modalErr");
      errBox.hidden = true;
      form.appendChild(errBox);

      const inputs = {};
      for (const f of (opts.fields || [])) {
        const box2 = el("div", "field");
        const id = "f_" + f.name;
        if (f.type === "checkbox") {
          const row = el("div", "row");
          const inp = el("input");
          inp.type = "checkbox"; inp.id = id; inp.checked = !!f.value;
          const lb = el("label", null, f.label);
          lb.setAttribute("for", id);
          row.appendChild(inp); row.appendChild(lb);
          box2.appendChild(row);
          inputs[f.name] = inp;
        } else {
          const lb = el("label", null, f.label);
          lb.setAttribute("for", id);
          box2.appendChild(lb);
          let inp;
          if (f.type === "textarea") {
            inp = el("textarea");
            inp.value = f.value || "";
            if (f.rows) inp.rows = f.rows;
          } else if (f.type === "select") {
            inp = el("select");
            for (const o of (f.options || [])) {
              const op = el("option", null, o.label);
              op.value = o.value;
              if (String(o.value) === String(f.value)) op.selected = true;
              inp.appendChild(op);
            }
          } else {
            inp = el("input");
            inp.type = f.type === "number" ? "number" : "text";
            if (f.type === "number") { inp.min = "0"; inp.max = "5"; }
            inp.value = f.value === undefined || f.value === null ? "" : String(f.value);
          }
          inp.id = id;
          inp.name = f.name;
          if (f.maxlength) inp.maxLength = f.maxlength;
          if (f.placeholder) inp.placeholder = f.placeholder;
          if (f.required) inp.required = true;
          box2.appendChild(inp);
          if (f.hint) {
            const hint = el("div", "hint", f.hint);
            hint.id = id + "_hint";
            box2.appendChild(hint);
          }
          inputs[f.name] = inp;
        }
        form.appendChild(box2);
      }

      if (opts.body) form.appendChild(opts.body);

      const foot = el("div", "modalFoot");
      const cancel = el("button", "btn", opts.cancelLabel || "Batal");
      cancel.type = "button";
      const submit = el("button", "btn " + (opts.danger ? "danger" : "primary"), opts.submit || "Simpan");
      submit.type = "submit";
      foot.appendChild(cancel); foot.appendChild(submit);
      form.appendChild(foot);
      box.appendChild(form);
      wrap.appendChild(bg); wrap.appendChild(box);
      $("modalHost").appendChild(wrap);

      const close = (value) => {
        wrap.remove();
        document.removeEventListener("keydown", onKey, true);
        resolve(value);
      };
      const onKey = (e) => {
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(null); }
      };
      document.addEventListener("keydown", onKey, true);
      cancel.onclick = () => close(null);
      bg.onclick = () => close(null);
      form.onsubmit = (e) => {
        e.preventDefault();
        const values = {};
        for (const name of Object.keys(inputs)) {
          const inp = inputs[name];
          values[name] = inp.type === "checkbox" ? inp.checked : inp.value;
        }
        if (opts.collect) opts.collect(values);
        if (opts.validate) {
          const msg = opts.validate(values);
          if (msg) { errBox.textContent = msg; errBox.hidden = false; return; }
        }
        close(values);
      };
      const first = box.querySelector("input:not([type=checkbox]), textarea, select");
      if (first) { first.focus(); if (first.select) first.select(); }
    });
  }

  function confirmAsk(title, intro, submit) {
    return ask({ title, intro, submit: submit || "Lanjutkan", danger: true, fields: [] })
      .then((v) => v !== null);
  }

  // ---------------- data ----------------
  async function fetchJSON(url) {
    const res = await fetch(url, { cache: "no-store" });
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const msg = (data && (data.error || data.detail)) || ("HTTP " + res.status);
      const err = new Error(msg);
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  async function loadBoards() {
    const data = await fetchJSON("/api/agents/boards");
    if (!Array.isArray(data)) throw new Error("daftar board tidak dikenali");
    state.boards = data;
    let wanted = "";
    try { wanted = String(new URLSearchParams(location.search).get("slug") || ""); } catch {}
    const usable = state.boards.filter((b) => b.slug === (wanted || readSavedBoard()));
    const running = state.boards.filter((b) => b.running_count > 0);
    const pick = usable[0] || state.boards.find((b) => b.current) || running[0] ||
                 state.boards.find((b) => b.task_count > 0) || state.boards[0];
    state.slug = pick ? pick.slug : "";
    try { localStorage.setItem(LS_BOARD, state.slug); } catch {}
    renderBoards();
  }

  function readSavedBoard() {
    try { return String(localStorage.getItem(LS_BOARD) || ""); } catch { return ""; }
  }

  async function loadAssignees(force) {
    try {
      const data = await fetchJSON("/api/agents/assignees" + (force ? "?refresh=1" : ""));
      state.assignees = Array.isArray(data.assignees) ? data.assignees : [];
      state.assigneeNote = data.note || "";
    } catch (e) {
      state.assignees = [];
      state.assigneeNote = "Daftar profil gagal dimuat: " + (e && e.message ? e.message : e) +
        " — assignee baru bisa diisi setelah CLI kanban sehat.";
    }
    renderAssigneeFilter();
  }

  async function loadBoard() {
    if (!state.slug) { state.updatedAt = Math.floor(Date.now() / 1000); state.loaded = true; return; }
    state.busy = true;
    $("refresh").classList.add("busy");
    $("dot").className = "dot busy";
    try {
      const boards = await fetchJSON("/api/agents/boards").catch(() => null);
      if (Array.isArray(boards)) { state.boards = boards; renderBoards(); }
      const data = await fetchJSON("/api/agents/board?slug=" + encodeURIComponent(state.slug) + "&limit=200");
      if (!data || !Array.isArray(data.tasks)) throw new Error("payload papan tidak dikenali");
      state.counts = data.counts || {};
      state.tasks = data.tasks || [];
      state.updatedAt = data.generated_at || Math.floor(Date.now() / 1000);
      state.error = "";
      state.loaded = true;
      renderChips();
      renderAssigneeFilter();
      renderBoard();
    } finally {
      state.busy = false;
      $("refresh").classList.remove("busy");
    }
  }

  async function refresh(manual) {
    if (state.busy && !manual) return;
    try {
      if (!state.boards.length) await loadBoards();
      if (!state.assignees.length) await loadAssignees(false);
      await loadBoard();
      paintError();
      paintUpdated();
    } catch (e) {
      if (!state.loaded) { state.loaded = true; renderBoard(); }
      state.error = "Gagal memuat data papan: " + (e && e.message ? e.message : String(e));
      paintError();
    }
  }

  const taskById = (id) => state.tasks.filter((t) => t.id === id)[0] || null;

  // ---------------- render kepala ----------------
  function paintUpdated() {
    const age = state.updatedAt ? Math.max(0, Math.floor(Date.now() / 1000) - state.updatedAt) : 0;
    $("dot").className = "dot on";
    $("updated").textContent = state.updatedAt ? "diperbarui " + age + " dtk lalu" : "memuat…";
  }

  function paintError() {
    const box = $("errbar");
    box.innerHTML = "";
    if (!state.error) return;
    $("dot").className = "dot off";
    box.appendChild(el("div", "errbar", "⚠ " + state.error));
    $("updated").textContent = state.updatedAt
      ? "gagal menyegarkan · data " + Math.max(0, Math.floor(Date.now() / 1000) - state.updatedAt) + " dtk lalu"
      : "gagal memuat";
  }

  function boardOptionLabel(b) {
    const bits = [b.name || b.slug];
    if (b.running_count > 0) bits.push("• " + b.running_count + " jalan");
    else if (b.task_count > 0) bits.push("• " + b.task_count + " task");
    return bits.join(" — ");
  }

  function renderBoards() {
    const sel = $("boardSel");
    sel.innerHTML = "";
    for (const b of state.boards) {
      const opt = el("option", null, boardOptionLabel(b));
      opt.value = b.slug;
      if (b.slug === state.slug) opt.selected = true;
      sel.appendChild(opt);
    }
    const current = state.boards.filter((b) => b.slug === state.slug)[0];
    sel.setAttribute("aria-label", "Pilih papan kanban (sekarang: " + (current ? current.name : "-") + ")");
  }

  function chipKeys() {
    const keys = CORE_CHIPS.slice();
    for (const key of Object.keys(state.counts)) {
      if (key === "total" || key === "archived" || keys.includes(key)) continue;
      keys.push(key);
    }
    return keys;
  }

  function renderChips() {
    const box = $("chips");
    const keys = chipKeys();
    const known = state.chipEls || {};
    const same = keys.length === Object.keys(known).length && keys.every((k) => known[k]);
    if (!same) {
      box.innerHTML = "";
      const fresh = {};
      for (const key of keys) {
        const chip = el("button", "chip");
        chip.type = "button";
        const sw = el("span", "swatch");
        sw.style.background = statusInfo(key).color;
        chip.appendChild(sw);
        chip.appendChild(el("span", null, label(key) + " "));
        const num = el("b", null, "0");
        chip.appendChild(num);
        chip.onclick = () => {
          state.filter = state.filter === key ? null : key;
          paintChips();
          renderBoard();
        };
        box.appendChild(chip);
        fresh[key] = { chip, num };
      }
      state.chipEls = fresh;
    }
    paintChips();
  }

  function paintChips() {
    for (const key of Object.keys(state.chipEls || {})) {
      const entry = state.chipEls[key];
      const n = Number(state.counts[key] || 0);
      entry.num.textContent = String(n);
      entry.num.className = n ? "" : "zero";
      entry.chip.setAttribute("aria-pressed", state.filter === key ? "true" : "false");
      entry.chip.setAttribute("aria-label",
        "Filter status " + label(key) + ", " + n + " task" +
        (state.filter === key ? " (aktif — ketuk untuk melepas)" : ""));
    }
    paintNote();
  }

  // ---------------- filter ----------------
  function filtersActive() {
    return !!(state.filter || state.q.trim() || state.who || state.prio !== "" || state.runningOnly);
  }

  function matches(t) {
    if (state.filter && t.status !== state.filter) return false;
    if (state.who === "__none__") { if (t.assignee) return false; }
    else if (state.who && t.assignee !== state.who) return false;
    if (state.prio !== "" && Number(t.priority || 0) !== Number(state.prio)) return false;
    if (state.runningOnly && !(t.status === "running" || t.worker_alive)) return false;
    const q = state.q.trim().toLowerCase();
    if (q) {
      const hay = ((t.title || "") + " " + (t.assignee || "") + " " + t.id).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    // Kolom yang disembunyikan tetap bisa dilihat lewat chip statusnya.
    if (!visibleCols().includes(t.status) && state.filter !== t.status) return false;
    return true;
  }

  function visibleTasks() {
    return state.tasks.filter((t) => t.status !== "archived" && matches(t));
  }

  function saveFilters() {
    lsSet(LS_FILT, { q: state.q, who: state.who, prio: state.prio, runningOnly: state.runningOnly });
  }

  function readFilters() {
    const saved = lsGet(LS_FILT, null);
    if (!saved || typeof saved !== "object") return;
    state.q = typeof saved.q === "string" ? saved.q : "";
    state.who = typeof saved.who === "string" ? saved.who : "";
    state.prio = saved.prio === undefined || saved.prio === null ? "" : String(saved.prio);
    state.runningOnly = !!saved.runningOnly;
  }

  function paintNote() {
    const note = $("chipNote");
    note.innerHTML = "";
    if (!state.slug) {
      note.appendChild(el("span", null, "Belum ada board dipilih."));
      return;
    }
    const total = Number(state.counts.total || 0) - Number(state.counts.archived || 0);
    const shown = visibleTasks().length;
    const bits = [];
    bits.push(total + " task di board ini");
    if (Number(state.counts.archived || 0)) bits.push(Number(state.counts.archived) + " arsip disembunyikan");
    note.appendChild(el("span", null, bits.join(" · ")));
    if (filtersActive()) {
      const res = el("span", "res", "· menampilkan " + shown + " dari " + total);
      note.appendChild(res);
      const reset = el("button", "linkBtn", "Reset filter");
      reset.type = "button";
      reset.onclick = resetFilters;
      note.appendChild(reset);
    }
    if (state.filter) note.appendChild(el("span", "res", "· status: " + label(state.filter)));
    // Task yang tersembunyi karena pilihannya di tombol "Kolom" perlu disebut,
    // supaya daftar yang lebih pendek tidak terbaca sebagai data hilang.
    const hiddenCols = state.tasks.filter((t) => t.status !== "archived" &&
      !visibleCols().includes(t.status) && state.filter !== t.status).length;
    if (hiddenCols) {
      note.appendChild(el("span", null, "· " + hiddenCols + " task di kolom tersembunyi"));
      const show = el("button", "linkBtn", "tampilkan");
      show.type = "button";
      show.onclick = openColumnPicker;
      note.appendChild(show);
    }
  }

  function renderAssigneeFilter() {
    const sel = $("fWho");
    if (!sel) return;
    const names = {};
    for (const t of state.tasks) if (t.assignee) names[t.assignee] = true;
    for (const a of state.assignees) if (a && a.name) names[a.name] = true;
    const keys = Object.keys(names).sort();
    sel.innerHTML = "";
    const all = el("option", null, "Semua assignee");
    all.value = "";
    sel.appendChild(all);
    for (const name of keys) {
      const op = el("option", null, name);
      op.value = name;
      sel.appendChild(op);
    }
    const none = el("option", null, "(tanpa assignee)");
    none.value = "__none__";
    sel.appendChild(none);
    sel.value = state.who || "";
    if (sel.value !== (state.who || "")) sel.value = "";
  }

  function resetFilters() {
    state.q = ""; state.who = ""; state.prio = ""; state.runningOnly = false; state.filter = null;
    $("q").value = "";
    $("fWho").value = "";
    $("fPrio").value = "";
    $("fRun").checked = false;
    saveFilters();
    paintChips();
    renderBoard();
  }

  // ---------------- kolom ----------------
  function columnsFor() {
    const cols = COLUMNS.slice();
    for (const key of Object.keys(state.counts)) {
      if (key === "total" || key === "archived" || cols.includes(key)) continue;
      cols.push(key);                         // mis. `scheduled` kalau ada
    }
    return cols;
  }

  function readCols() {
    const saved = lsGet(LS_COLS, null);
    if (saved && typeof saved === "object") {
      if (Array.isArray(saved.wide)) state.cols.wide = saved.wide.filter((k) => typeof k === "string");
      if (Array.isArray(saved.narrow)) state.cols.narrow = saved.narrow.filter((k) => typeof k === "string");
    }
  }

  function savedCols() {
    return state.cols[state.compact ? "narrow" : "wide"];
  }

  function visibleCols() {
    const all = columnsFor();
    const saved = savedCols();
    if (!saved) {
      return state.compact ? all.filter((k) => !NARROW_HIDDEN.includes(k)) : all;
    }
    return all.filter((k) => saved.includes(k));
  }

  function isColVisible(key) {
    const saved = savedCols();
    if (!saved) return state.compact ? !NARROW_HIDDEN.includes(key) : true;
    return saved.includes(key);
  }

  function toggleCol(key, on) {
    const saved = (savedCols() || visibleCols()).slice();
    const set = new Set(saved);
    if (on) set.add(key); else set.delete(key);
    // urutkan mengikuti urutan kolom baku supaya stabil
    const ordered = columnsFor().filter((k) => set.has(k));
    state.cols[state.compact ? "narrow" : "wide"] = ordered;
    lsSet(LS_COLS, state.cols);
    if (state.filter && !ordered.includes(state.filter)) state.filter = null;
    paintChips();
    renderBoard();
  }

  function openColumnPicker() {
    const list = el("div", "colPick");
    for (const key of columnsFor()) {
      const row = el("label");
      const inp = el("input");
      inp.type = "checkbox";
      inp.checked = isColVisible(key);
      inp.value = key;
      inp.onchange = () => toggleCol(key, inp.checked);
      const sw = el("span", "swatch");
      sw.style.background = statusInfo(key).color;
      row.appendChild(inp);
      row.appendChild(sw);
      row.appendChild(el("span", null, label(key)));
      list.appendChild(row);
    }
    const hint = el("div", "muted",
      state.compact
        ? "Mode ringkas (layar < 760px) memakai daftar satu kolom; pilihan ini menentukan status yang ikut tampil di daftar."
        : "Pilihan disimpan di peramban ini dan bertahan setelah muat ulang.");
    hint.style.marginTop = "8px";
    const wrap = el("div");
    wrap.appendChild(list);
    wrap.appendChild(hint);
    ask({
      title: "Tampilkan kolom",
      intro: "Centang kolom yang ingin ditampilkan.",
      body: wrap,
      submit: "Selesai",
      cancelLabel: "Tutup",
    });
  }

  // ---------------- kartu ----------------
  function statusBadge(status) {
    const info = statusInfo(status);
    const badge = el("span", "badge" + (status === "running" ? " run" : ""), info.label);
    badge.style.setProperty("--c", info.color);
    badge.appendChild(el("span", "bd"));
    return badge;
  }

  function cardEl(task) {
    const card = el("article", "card" + (task.status === "running" ? " run" : "") +
      (task.id === state.freshId ? " new" : ""));
    card.draggable = true;
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.dataset.id = task.id;
    card.dataset.status = task.status;
    card.setAttribute("aria-label",
      "Task " + task.title + ", status " + label(task.status) +
      (task.assignee ? ", agent " + task.assignee : "") + ", " + rel(activityAt(task)));

    const top = el("div", "ctop");
    top.appendChild(statusBadge(task.status));
    const pr = Number(task.priority || 0);
    if (pr > 0) top.appendChild(el("span", "prio p" + pr, PRIORITY_LABEL[pr] || ("P" + pr)));
    const grip = el("span", "grip", "⠿");
    grip.setAttribute("aria-hidden", "true");
    grip.title = "Tarik ke kolom lain";
    top.appendChild(grip);
    const move = el("button", "cbtn", "⋯");
    move.type = "button";
    move.setAttribute("aria-haspopup", "menu");
    move.setAttribute("aria-label", "Pindahkan task " + task.title);
    move.title = "Pindahkan ke…";
    move.draggable = false;
    move.onclick = (e) => { e.stopPropagation(); openMoveMenu(task, move); };
    move.onpointerdown = (e) => e.stopPropagation();
    top.appendChild(move);
    card.appendChild(top);

    card.appendChild(el("div", "ttl", task.title || "(tanpa judul)"));

    const meta = el("div", "cmeta");
    if (task.assignee) {
      const who = el("span", "who");
      who.appendChild(el("span", "avatar", initials(task.assignee)));
      who.appendChild(el("span", null, task.assignee));
      meta.appendChild(who);
    } else {
      meta.appendChild(el("span", "prio", "unassigned"));
    }
    meta.appendChild(el("span", "when", rel(activityAt(task))));
    card.appendChild(meta);

    const foot = el("div", "cfoot");
    if (task.comment_count) {
      const tag = el("span", "tag", "💬 " + task.comment_count);
      tag.title = task.comment_count + " komentar";
      foot.appendChild(tag);
    }
    if (task.status === "blocked" && task.block_kind) {
      foot.appendChild(el("span", "tag warn", task.block_kind));
    }
    if (task.status === "running" && task.worker_alive === false) {
      foot.appendChild(el("span", "tag", "worker tidak ditemukan"));
    }
    if (task.parents && task.parents.length) foot.appendChild(el("span", "tag", "induk " + task.parents.length));
    if (foot.childNodes.length) card.appendChild(foot);

    const open = () => openDetail(task.id, card);
    card.onclick = open;
    card.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
    };
    card.addEventListener("dragstart", (e) => {
      state.dragId = task.id;
      card.classList.add("dragging");
      try {
        e.dataTransfer.setData("text/plain", task.id);
        e.dataTransfer.effectAllowed = "move";
      } catch {}
    });
    card.addEventListener("dragend", () => {
      state.dragId = "";
      card.classList.remove("dragging");
      document.querySelectorAll(".col.over").forEach((c) => c.classList.remove("over"));
    });
    return card;
  }

  // ---------------- render papan ----------------
  function boardVisibleCount() {
    return Math.max(0, Number(state.counts.total || 0) - Number(state.counts.archived || 0));
  }

  function renderSkeleton() {
    const box = $("cols");
    box.className = "cols";
    box.innerHTML = "";
    for (let i = 0; i < 4; i++) {
      const col = el("div", "skCol");
      col.appendChild(el("div", "sk skHead"));
      col.appendChild(el("div", "sk skCard"));
      col.appendChild(el("div", "sk skCard"));
      box.appendChild(col);
    }
    $("emptyAll").innerHTML = "";
    $("emptyList").innerHTML = "";
  }

  function renderOnboarding() {
    const panel = el("div", "onboard");
    panel.appendChild(el("h2", null, "Papan ini masih kosong"));
    panel.appendChild(el("p", "lead",
      "Alur kerjanya tiga langkah: kamu menulis task, task masuk Ready, lalu dispatcher gateway menjalankan worker-nya."));
    const steps = el("ol", "steps");
    const data = [
      ["Buat task", "Tulis judul singkat dan deskripsi yang jelas: konteks, batasan, dan cara verifikasi."],
      ["Pindahkan ke Ready", "Task baru langsung lahir di Ready. Assignee menentukan profil worker yang menjalankannya."],
      ["Worker jalan otomatis", "Dispatcher di gateway mengambil task Ready, membuka workspace, lalu melapor lewat komentar."],
    ];
    for (const [title, desc] of data) {
      const li = el("li");
      li.appendChild(el("span", "n", String(steps.childNodes.length + 1)));
      const body = el("div");
      body.appendChild(el("b", null, title));
      body.appendChild(el("span", null, desc));
      li.appendChild(body);
      steps.appendChild(li);
    }
    panel.appendChild(steps);
    const foot = el("div", "obFoot");
    const big = el("button", "btn primary big", "Buat task pertama");
    big.type = "button";
    big.onclick = () => createTask({});
    foot.appendChild(big);
    const cols = el("button", "btn", "Pilih kolom");
    cols.type = "button";
    cols.onclick = openColumnPicker;
    foot.appendChild(cols);
    const help = el("button", "btn", "Pintasan (?)");
    help.type = "button";
    help.onclick = showShortcuts;
    foot.appendChild(help);
    panel.appendChild(foot);
    return panel;
  }

  function renderNoResults() {
    const panel = el("div", "onboard");
    panel.appendChild(el("h2", null, "Tidak ada task yang cocok"));
    const active = [];
    if (state.q.trim()) active.push("pencarian \"" + state.q.trim() + "\"");
    if (state.who) active.push("assignee " + (state.who === "__none__" ? "(tanpa assignee)" : state.who));
    if (state.prio !== "") active.push("prioritas P" + state.prio);
    if (state.runningOnly) active.push("hanya yang jalan");
    if (state.filter) active.push("status " + label(state.filter));
    panel.appendChild(el("p", "lead", "Filter aktif: " + active.join(", ") + "."));
    const foot = el("div", "obFoot");
    const reset = el("button", "btn primary", "Reset filter");
    reset.type = "button";
    reset.onclick = resetFilters;
    foot.appendChild(reset);
    const all = el("button", "btn", "Tampilkan semua kolom");
    all.type = "button";
    all.onclick = () => { state.cols[state.compact ? "narrow" : "wide"] = columnsFor().slice(); lsSet(LS_COLS, state.cols); paintChips(); renderBoard(); };
    foot.appendChild(all);
    panel.appendChild(foot);
    return panel;
  }

  function renderBoard() {
    if (!state.loaded) { renderSkeleton(); return; }
    const box = $("cols");
    const emptyAll = $("emptyAll");
    const emptyList = $("emptyList");
    box.innerHTML = "";
    emptyAll.innerHTML = "";
    emptyList.innerHTML = "";

    if (!state.boards.length) {
      box.hidden = true;
      const div = el("div", "empty");
      div.appendChild(el("b", null, "Belum ada board kanban"));
      div.appendChild(el("div", null, "Buat board lewat tombol \"Board baru\" di atas."));
      emptyAll.appendChild(div);
      $("chipNote").textContent = "";
      return;
    }

    const total = boardVisibleCount();
    if (!total) {
      box.hidden = true;
      emptyAll.appendChild(renderOnboarding());
      paintNote();
      return;
    }

    const shown = visibleTasks();
    if (!shown.length) {
      box.hidden = true;
      emptyAll.appendChild(renderNoResults());
      paintNote();
      return;
    }

    box.hidden = false;
    const cols = visibleCols();

    if (state.compact) {
      // Mode ringkas: satu daftar kartu, urut status lalu aktivitas.
      box.className = "list";
      box.setAttribute("aria-label", "Daftar task");
      const order = {};
      columnsFor().forEach((k, i) => { order[k] = i; });
      const sorted = shown.slice().sort((a, b) => {
        const d = (order[a.status] === undefined ? 99 : order[a.status]) -
                  (order[b.status] === undefined ? 99 : order[b.status]);
        if (d) return d;
        return Number(activityAt(b) || 0) - Number(activityAt(a) || 0);
      });
      const frag = document.createDocumentFragment();
      for (const t of sorted) frag.appendChild(cardEl(t));
      box.appendChild(frag);
      paintNote();
      return;
    }

    box.className = "cols";
    box.setAttribute("aria-label", "Kolom papan kanban");
    const buckets = {};
    for (const key of columnsFor()) buckets[key] = [];
    for (const t of state.tasks) {
      if (t.status === "archived") continue;
      (buckets[t.status] || (buckets[t.status] = [])).push(t);
    }

    const frag = document.createDocumentFragment();
    for (const key of cols) {
      const all = buckets[key] || [];
      const tasks = all.filter((t) => matches(t));
      const col = el("section", "col");
      col.dataset.status = key;

      const head = el("div", "colHead");
      const sw = el("span", "sw");
      sw.style.background = statusInfo(key).color;
      head.appendChild(sw);
      head.appendChild(el("span", "nm", label(key)));
      const count = el("span", "ct", String(tasks.length));
      if (tasks.length !== all.length) count.title = tasks.length + " dari " + all.length + " task (difilter)";
      head.appendChild(count);
      const add = el("button", "cadd", "+");
      add.type = "button";
      add.title = "Task baru di " + label(key);
      add.setAttribute("aria-label", "Task baru di kolom " + label(key));
      add.onclick = () => createTask({ target: key });
      head.appendChild(add);
      col.appendChild(head);

      const body = el("div", "colBody");
      if (!tasks.length) {
        const hint = el("div", "colEmpty");
        hint.appendChild(document.createTextNode(
          all.length ? "Disaring (" + all.length + " task)" :
          key === "triage" ? "Belum ada task triage" :
          key === "todo" ? "Menunggu induk selesai" :
          key === "running" ? "Tidak ada worker berjalan" :
          "Belum ada task"));
        hint.appendChild(el("span", "dd", "Kartu bisa ditarik ke sini, atau pakai ⋯ di kartu"));
        body.appendChild(hint);
      } else {
        for (const t of tasks) body.appendChild(cardEl(t));
      }
      col.appendChild(body);

      // Drop target: hanya kolom yang punya transisi masuk yang menerima drop.
      col.addEventListener("dragover", (e) => {
        if (!state.dragId) return;
        const src = taskById(state.dragId);
        if (!src) return;
        const plan = transitionFor(src.status, key);
        if (plan.error) {
          col.classList.add("nodrop");
          try { e.dataTransfer.dropEffect = "none"; } catch {}
          return;
        }
        e.preventDefault();
        col.classList.remove("nodrop");
        try { e.dataTransfer.dropEffect = "move"; } catch {}
        col.classList.add("over");
      });
      col.addEventListener("dragleave", (e) => {
        if (!col.contains(e.relatedTarget)) col.classList.remove("over");
      });
      col.addEventListener("drop", (e) => {
        e.preventDefault();
        col.classList.remove("over");
        const src = taskById(state.dragId || "");
        state.dragId = "";
        if (!src) return;
        const plan = transitionFor(src.status, key);
        if (plan.error) { toast(plan.error, "err"); return; }
        runTransition(src, key, plan, null);
      });

      frag.appendChild(col);
    }
    box.appendChild(frag);
    // Paskan kolom ke lebar layar kalau masing-masing masih >= 185px.
    box.style.setProperty("--n", String(cols.length));
    const need = cols.length * 185 + (cols.length - 1) * 10;
    box.classList.toggle("fit", need <= box.clientWidth);
    paintNote();
  }

  // ---------------- menu "Pindahkan ke…" ----------------
  function closeMenu() {
    if (!menuEl) return;
    menuEl.remove();
    menuEl = null;
    document.removeEventListener("click", onMenuDismiss, true);
    document.removeEventListener("keydown", onMenuKey, true);
    window.removeEventListener("resize", closeMenu);
    window.removeEventListener("scroll", closeMenu, true);
  }

  function onMenuDismiss(e) {
    if (menuEl && !menuEl.contains(e.target)) closeMenu();
  }
  function onMenuKey(e) {
    if (e.key === "Escape") { e.stopPropagation(); e.preventDefault(); closeMenu(); }
  }

  function openMoveMenu(task, anchor) {
    closeMenu();
    const menu = el("div", "menu");
    menu.setAttribute("role", "menu");
    menu.appendChild(el("div", "menuH", "Pindahkan ke…"));

    const cols = columnsFor();
    for (const key of cols) {
      const plan = transitionFor(task.status, key);
      const dis = !!plan.error;
      const item = el(dis ? "div" : "button", "menuItem" + (dis ? " dis" : ""));
      if (!dis) {
        item.type = "button";
        item.setAttribute("role", "menuitem");
        item.onclick = guardMut((ev) => {
          ev.stopPropagation();
          closeMenu();
          runTransition(task, key, plan, item);
        });
      } else {
        item.setAttribute("aria-disabled", "true");
        item.title = plan.error;
      }
      const name = el("span", "miName");
      const sw = el("span", "swatch");
      sw.style.background = statusInfo(key).color;
      name.appendChild(sw);
      name.appendChild(el("span", null, label(key)));
      item.appendChild(name);
      item.appendChild(el("span", "miAct", dis ? plan.error : plan.label));
      menu.appendChild(item);
    }
    document.body.appendChild(menu);
    menuEl = menu;

    const r = anchor.getBoundingClientRect();
    const w = menu.offsetWidth;
    const h = menu.offsetHeight;
    let left = Math.min(r.left, window.innerWidth - w - 8);
    left = Math.max(8, left);
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    menu.style.left = left + "px";
    menu.style.top = top + "px";

    setTimeout(() => {
      document.addEventListener("click", onMenuDismiss, true);
      document.addEventListener("keydown", onMenuKey, true);
      window.addEventListener("resize", closeMenu);
      window.addEventListener("scroll", closeMenu, true);
    }, 0);
    const first = menu.querySelector("button");
    if (first) first.focus();
  }

  // ---------------- transisi (dipakai drag, menu, tombol) ----------------
  // Satu sumber kebenaran untuk "pindah kolom ini jadi aksi apa". Drop yang tidak
  // masuk akal ditolak dengan pesan, bukan gagal diam-diam.
  function transitionFor(from, to) {
    if (from === to) return { error: "Kartu sudah ada di kolom " + label(to) + "." };
    if (from === "archived") return { error: "Task sudah diarsipkan." };
    if (from === "running") {
      return { error: "Task sedang dijalankan worker — pakai Block/Complete di detail supaya run worker ikut ditutup." };
    }
    if (to === "triage") {
      return { error: "Triage hanya untuk task baru. Untuk mengembalikan task, pakai Block atau Reopen review." };
    }
    if (to === "todo") {
      return { error: "Todo berarti menunggu induk (dependency), bukan aksi manual. Pakai Block jenis dependency." };
    }
    if (to === "ready") {
      if (from === "review") return { action: "reopen", label: "Reopen review" };
      if (from === "todo" || from === "blocked") return { action: "promote", label: "Promote" };
      if (from === "done") return { error: "Task selesai tidak bisa dikembalikan ke Ready (CLI tidak punya verb pembatalan)." };
      return { error: "Dari " + label(from) + " tidak ada aksi menuju Ready." };
    }
    if (to === "blocked") {
      if (from === "done") return { error: "Task yang sudah selesai tidak bisa di-block." };
      return { action: "block", needsReason: true, label: "Block (butuh alasan)" };
    }
    if (to === "done") {
      if (from === "triage") return { error: "Task triage belum punya spesifikasi; selesaikan triage dulu." };
      return { action: "complete", needsResult: true, label: "Complete (butuh bukti hasil)" };
    }
    if (to === "review") {
      if (from !== "ready" && from !== "running") return { error: "Request review hanya dari Ready (atau Running lewat detail)." };
      return { action: "review", label: "Request review" };
    }
    return { error: "Belum ada aksi untuk pindah ke " + label(to) + "." };
  }

  // Urungkan: hanya ada kalau CLI punya verb kebalikannya. `complete` dan `archive`
  // tidak punya verb pembatalan (dibuktikan: promote/unblock/reopen ditolak untuk
  // status done, dan arsip tidak bisa dibalik), jadi jalan pemulihannya adalah
  // membuat ulang task dengan isi yang sama.
  function undoFor(action, task) {
    if (action === "block") {
      return {
        label: "Urungkan block",
        run: () => act("unblock", { id: task.id, reason: "Urungkan block lewat Papan Kanban." }, null, null),
      };
    }
    if (action === "complete" || action === "archive") {
      const detail = state.detail && state.detail.id === task.id ? state.detail : null;
      return {
        label: "Buat ulang task",
        run: () => createTask({ prefill: {
          title: task.title,
          body: detail ? (detail.body || "") : (task.body_preview || ""),
          priority: task.priority,
        } }),
      };
    }
    return null;
  }

  async function runTransition(task, to, plan, trigger) {
    const payload = { id: task.id };
    if (plan.needsReason) {
      const v = await ask({
        title: "Block: " + (task.title || task.id),
        intro: "Task berhenti sampai alasannya ditindaklanjuti. Alasan ikut tercatat sebagai komentar.",
        fields: [
          { name: "reason", label: "Alasan", type: "textarea", required: true, maxlength: 500,
            placeholder: "mis. butuh kredensial staging / menunggu keputusan produk" },
          { name: "kind", label: "Jenis block", type: "select", value: "needs_input",
            options: [
              { value: "needs_input", label: "needs_input — butuh keputusan manusia" },
              { value: "capability", label: "capability — butuh izin/alat" },
              { value: "dependency", label: "dependency — menunggu task lain" },
              { value: "transient", label: "transient — gagal sementara" },
            ] },
        ],
        submit: "Block task",
        validate: (v) => (v.reason || "").trim() ? "" : "Alasan wajib diisi.",
      });
      if (!v) return null;
      payload.reason = (v.reason || "").trim();
      payload.kind = v.kind;
    } else if (plan.needsResult) {
      const v = await ask({
        title: "Selesaikan: " + (task.title || task.id),
        intro: "CLI kanban menolak task selesai tanpa bukti hasil. Tulis singkat apa yang dikerjakan/diverifikasi.\nCatatan: complete tidak bisa dibatalkan dari sini — tidak ada verb pembatalannya.",
        fields: [{ name: "result", label: "Hasil", type: "textarea", rows: 3,
          value: "Selesai lewat Papan Kanban Web Chat.", maxlength: 4000 }],
        submit: "Tandai selesai",
        validate: (v) => (v.result || "").trim().length >= 3 ? "" : "Hasil minimal 3 karakter.",
      });
      if (!v) return null;
      payload.result = (v.result || "").trim();
    }
    return act(plan.action, payload, trigger, task);
  }

  function busyButton(btn, text) {
    if (!btn || btn.tagName !== "BUTTON") return () => {};
    const orig = btn.textContent;
    btn.disabled = true;
    btn.classList.add("busy");
    btn.textContent = text;
    return () => {
      btn.disabled = false;
      btn.classList.remove("busy");
      btn.textContent = orig;
    };
  }

  async function act(action, payload, trigger, task) {
    if (state.mutating) {
      toast("Masih menyimpan aksi sebelumnya — tunggu sebentar.", "");
      return null;
    }
    state.mutating++;
    document.body.classList.add("mutating");
    const restore = busyButton(trigger, "Menyimpan…");
    const body = Object.assign({ slug: state.slug, action }, payload);
    try {
      const res = await fetch("/api/agents/task-update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || !data.ok) {
        let msg = (data && data.error) || ("HTTP " + res.status);
        if (data && data.detail && data.detail !== data.error) msg += " — " + data.detail;
        throw new Error(msg);
      }
      if (data.id) state.freshId = data.id;
      if (state.detailId && state.detailId === (payload && payload.id)) {
        if (data.task) {
          state.detail = data.task;
          renderDetail(data.task, { task: data.task });
        }
      }
      if (action === "archive") closeDetail();     // kartu sudah keluar dari papan
      const undo = task ? undoFor(action, task) : null;
      toast(data.message || ("Aksi " + action + " berhasil."), "ok", undo ? { action: undo } : {});
      await loadBoard().catch(() => {});
      paintUpdated(); paintError();
      if (state.detailId && state.detailId === (payload && payload.id) && !data.task) {
        await openDetail(state.detailId, null, true);
      }
      return data;
    } catch (e) {
      toast("Gagal: " + (e && e.message ? e.message : e), "err");
      return null;
    } finally {
      state.mutating--;
      if (!state.mutating) document.body.classList.remove("mutating");
      restore();
    }
  }

  // ---------------- detail sheet ----------------
  function kv(pairs) {
    const box = el("div", "kv");
    for (const [k, v] of pairs) {
      if (v === undefined || v === null || v === "") continue;
      const item = el("span");
      item.appendChild(el("span", "k", k + ": "));
      item.appendChild(el("span", null, String(v)));
      box.appendChild(item);
    }
    return box;
  }

  function section(title) {
    const sec = el("div", "sec");
    sec.appendChild(el("h3", null, title));
    return sec;
  }

  function pathRow(path) {
    const wrap = el("div", "pathrow");
    wrap.appendChild(el("div", "mono", path));
    const btn = el("button", "copy", "Salin");
    btn.type = "button";
    btn.setAttribute("aria-label", "Salin path workspace");
    btn.onclick = () => copyText(path, btn);
    wrap.appendChild(btn);
    return wrap;
  }

  // Aksi yang membuka dialog pun ditahan saat mutasi lain masih berjalan, supaya
  // klik beruntun tidak menumpuk dialog lalu menembak dua mutasi.
  function guardMut(fn) {
    return (...args) => {
      if (state.mutating) {
        toast("Masih menyimpan aksi sebelumnya — tunggu sebentar.", "");
        return undefined;
      }
      return fn(...args);
    };
  }

  function actionButton(text, cls, fn, title) {
    const b = el("button", "btn sm" + (cls ? " " + cls : ""), text);
    b.type = "button";
    b.dataset.mut = "1";
    if (title) b.title = title;
    b.onclick = guardMut(() => fn(b));
    return b;
  }

  function bigButton(text, cls, fn, title) {
    const b = el("button", "btn big" + (cls ? " " + cls : ""), text);
    b.type = "button";
    b.dataset.mut = "1";
    if (title) b.title = title;
    b.onclick = guardMut(() => fn(b));
    return b;
  }

  function sheetSummary(task) {
    const row = el("div", "shSum");
    const put = (labelText, value) => {
      const item = el("span");
      item.appendChild(el("span", null, labelText + ": "));
      item.appendChild(el("span", "v", value));
      row.appendChild(item);
    };
    put("Status", label(task.status));
    put("Assignee", task.assignee || "belum ada");
    put("Prioritas", PRIORITY_LABEL[Number(task.priority || 0)] || ("P" + (task.priority || 0)));
    put("Umur", rel(task.created_at));
    if (task.started_at) put("Mulai", rel(task.started_at));
    if (task.completed_at) put("Selesai", rel(task.completed_at));
    if (task.comment_count !== undefined) put("Komentar", String(task.comment_count));
    const idRow = el("span", "idrow");
    idRow.appendChild(el("span", null, "ID: "));
    idRow.appendChild(el("code", null, task.id));
    const cp = el("button", "mini", "salin id");
    cp.type = "button";
    cp.dataset.orig = "salin id";
    cp.onclick = () => copyText(task.id, cp);
    idRow.appendChild(cp);
    row.appendChild(idRow);
    return row;
  }

  function mainActions(task) {
    const box = el("div", "acts primary");
    const id = task.id;
    const status = task.status;
    if (status === "todo" || status === "blocked") {
      box.appendChild(bigButton("Promote ke Ready", "primary",
        (b) => act("promote", { id }, b, task),
        "Masukkan ke Ready — dispatcher gateway akan menjalankan worker"));
    }
    if (status === "blocked") {
      box.appendChild(bigButton("Unblock", "",
        (b) => act("unblock", { id, reason: "Dibuka lewat Papan Kanban." }, b, task)));
    }
    if (["ready", "todo", "triage", "review"].includes(status)) {
      box.appendChild(bigButton("Block…", "danger", async (b) => {
        const v = await ask({
          title: "Block task", fields: [
            { name: "reason", label: "Alasan", type: "textarea", required: true, maxlength: 500 },
            { name: "kind", label: "Jenis block", type: "select", value: "needs_input", options: [
              { value: "needs_input", label: "needs_input — butuh keputusan manusia" },
              { value: "capability", label: "capability — butuh izin/alat" },
              { value: "dependency", label: "dependency — menunggu task lain" },
              { value: "transient", label: "transient — gagal sementara" }] }],
          submit: "Block", danger: true,
          validate: (x) => (x.reason || "").trim() ? "" : "Alasan wajib diisi.",
        });
        if (!v) return;
        await act("block", { id, reason: (v.reason || "").trim(), kind: v.kind }, b, task);
      }, "Hentikan task dengan alasan"));
    }
    if (status !== "done" && status !== "archived") {
      box.appendChild(bigButton("Complete…", "", async (b) => {
        const v = await ask({
          title: "Tandai selesai",
          intro: status === "running"
            ? "Task ini sedang dijalankan worker. Menyelesaikan paksa akan menutup run worker — pastikan itu memang diinginkan."
            : "CLI kanban menolak penyelesaian tanpa bukti hasil.",
          fields: [{ name: "result", label: "Hasil", type: "textarea", rows: 3,
            value: "Diselesaikan manual lewat Papan Kanban Web Chat.", maxlength: 4000 }],
          submit: "Complete", danger: status === "running",
          validate: (x) => (x.result || "").trim().length >= 3 ? "" : "Hasil minimal 3 karakter.",
        });
        if (!v) return;
        await act("complete", { id, result: (v.result || "").trim(), force: status === "running" }, b, task);
      }, "Tandai task selesai"));
    }
    if (status === "ready" || status === "running") {
      box.appendChild(bigButton("Request review", "", async (b) => {
        const v = await ask({
          title: "Minta review",
          intro: "Ringkas apa yang sudah dikerjakan dan bagaimana diverifikasi.",
          fields: [{ name: "summary", label: "Ringkasan", type: "textarea", rows: 3, maxlength: 4000 }],
          submit: "Request review",
        });
        if (!v) return;
        await act("review", { id, summary: (v.summary || "").trim(), force: status === "running" }, b, task);
      }));
    }
    if (status === "review") {
      box.appendChild(bigButton("Reopen review", "", async (b) => {
        const v = await ask({ title: "Kembalikan ke pengerjaan", fields: [
          { name: "reason", label: "Alasan", type: "textarea", rows: 2, maxlength: 500 }], submit: "Reopen" });
        if (!v) return;
        await act("reopen", { id, reason: (v.reason || "").trim() }, b, task);
      }));
    }
    if (!box.childNodes.length) return null;
    return box;
  }

  function movesSection(task) {
    const sec = section("Pindahkan ke…");
    const list = el("div", "moves");
    for (const key of columnsFor()) {
      const plan = transitionFor(task.status, key);
      const b = el("button", "mv");
      b.type = "button";
      const nm = el("span", "mvName");
      const sw = el("span", "swatch");
      sw.style.background = statusInfo(key).color;
      nm.appendChild(sw);
      nm.appendChild(el("span", null, label(key)));
      b.appendChild(nm);
      if (plan.error) {
        b.disabled = true;
        b.title = plan.error;
        b.appendChild(el("span", "mvWhy", plan.error));
      } else {
        b.dataset.mut = "1";
        b.appendChild(el("span", "mvWhy", plan.label));
        b.onclick = guardMut(() => runTransition(task, key, plan, b));
      }
      list.appendChild(b);
    }
    sec.appendChild(list);
    return sec;
  }

  function secondaryActions(task) {
    const box = el("div", "acts");
    const id = task.id;
    box.appendChild(actionButton("Assign", "", async (b) => {
      const names = state.assignees.map((a) => ({ value: a.name, label: a.name }));
      if (!names.length) { toast("Belum ada profil assignee.", "err"); return; }
      const v = await ask({
        title: "Assign task",
        intro: task.assignee ? "Sekarang: " + task.assignee : "Task ini belum punya assignee.",
        fields: [{ name: "assignee", label: "Profil worker", type: "select",
          value: task.assignee || (names[0] && names[0].value),
          options: names.concat([{ value: "none", label: "(lepas assignee)" }]) }],
        submit: "Assign",
      });
      if (!v) return;
      await act("assign", { id, assignee: v.assignee }, b, task);
    }, "Pilih profil yang menjalankan task ini"));

    box.appendChild(actionButton("Set model", "", async (b) => {
      const v = await ask({
        title: "Set model worker",
        intro: "Override model untuk dispatch berikutnya. Isi 'none' untuk melepas.",
        fields: [{ name: "model", label: "Model", type: "text", value: "",
          placeholder: "mis. deepseek-v4.1-flash",
          hint: "Isi 'none' untuk melepas override model task ini." }],
        submit: "Simpan model",
        validate: (x) => (x.model || "").trim() ? "" : "Model wajib diisi (atau 'none').",
      });
      if (!v) return;
      await act("set-model", { id, model: (v.model || "").trim() }, b, task);
    }));

    box.appendChild(actionButton("Komentar", "", async (b) => {
      const v = await ask({ title: "Tambah komentar", fields: [
        { name: "text", label: "Komentar", type: "textarea", rows: 3, required: true, maxlength: 8000 }],
        submit: "Kirim", validate: (x) => (x.text || "").trim() ? "" : "Komentar wajib diisi." });
      if (!v) return;
      await act("comment", { id, text: (v.text || "").trim() }, b, task);
    }));

    box.appendChild(actionButton("Edit", "", async (b) => {
      const detail = (state.detail && state.detail.id === id) ? state.detail : null;
      const v = await ask({
        title: "Edit task", fields: [
          { name: "title", label: "Judul", type: "text", value: task.title || "", maxlength: 200 },
          { name: "body", label: "Deskripsi", type: "textarea", rows: 6,
            value: detail ? (detail.body || "") : (task.body_preview || "") },
        ], submit: "Simpan",
        validate: (x) => (x.title || "").trim() ? "" : "Judul wajib diisi.",
      });
      if (!v) return;
      await act("edit", { id, title: (v.title || "").trim(), body: v.body || "" }, b, task);
    }));

    box.appendChild(actionButton("Arsipkan", "danger", async (b) => {
      const ok = await confirmAsk("Arsipkan task?",
        "Task tidak dihapus — hanya dikeluarkan dari papan (masih ada di kanban.db). Arsip juga tidak bisa dibatalkan dari UI ini.",
        "Arsipkan");
      if (!ok) return;
      await act("archive", { id }, b, task);
    }, "Arsipkan task (bukan hapus)"));

    return box;
  }

  function timeline(detailTask) {
    const items = [];
    for (const c of (detailTask.comments || [])) {
      items.push({ kind: "cmt", at: Number(c.created_at || 0), author: c.author, text: c.body });
    }
    for (const ev of (detailTask.events || [])) {
      items.push({ kind: "ev", at: Number(ev.created_at || 0), author: "", text: ev.kind });
    }
    items.sort((a, b) => b.at - a.at);
    const wrap = el("div", "tl");
    if (!items.length) {
      wrap.appendChild(el("div", "muted", "Belum ada komentar atau event."));
      return wrap;
    }
    for (const it of items.slice(0, 40)) {
      const row = el("div", "it " + it.kind);
      const head = el("div", "h");
      if (it.kind === "cmt") {
        head.appendChild(el("b", null, it.author || "-"));
        head.appendChild(el("span", null, "komentar"));
      } else {
        head.appendChild(el("b", null, it.text || "event"));
      }
      head.appendChild(el("span", null, rel(it.at)));
      row.appendChild(head);
      if (it.kind === "cmt") row.appendChild(el("div", "b", it.text || ""));
      wrap.appendChild(row);
    }
    return wrap;
  }

  function renderDetail(task, extra) {
    const body = $("sheetBody");
    body.innerHTML = "";
    state.detail = (extra && extra.task) ? extra.task : null;
    $("sheetTitle").textContent = task.title || "(tanpa judul)";

    const top = el("div", "shTop");
    top.appendChild(statusBadge(task.status));
    const pr = Number(task.priority || 0);
    if (pr > 0) top.appendChild(el("span", "prio p" + pr, PRIORITY_LABEL[pr] || ("P" + pr)));
    if (task.status === "blocked" && task.block_kind) top.appendChild(el("span", "tag warn", task.block_kind));
    if (task.workspace_kind) top.appendChild(el("span", "tag", "workspace: " + task.workspace_kind));
    body.appendChild(top);

    body.appendChild(sheetSummary(task));

    const primary = mainActions(task);
    if (primary) body.appendChild(primary);

    body.appendChild(movesSection(task));

    body.appendChild(secondaryActions(task));

    if (task.status === "running") {
      const s = section("Worker");
      s.appendChild(kv([
        ["PID", String(task.worker_pid || "-") + (task.worker_alive ? " (hidup)" : " (tidak ditemukan)")],
        ["Heartbeat", task.last_heartbeat_at ? rel(task.last_heartbeat_at) : ""],
      ]));
      body.appendChild(s);
    }
    if (task.last_failure_error) {
      const s = section("Kegagalan terakhir");
      const fail = el("div", "mono");
      fail.textContent = task.last_failure_error;
      s.appendChild(fail);
      body.appendChild(s);
    }

    if (task.workspace_path) {
      const s2 = section("Workspace");
      s2.appendChild(pathRow(task.workspace_path));
      body.appendChild(s2);
    }

    const s3 = section("Deskripsi");
    const detailTask = (extra && extra.task) ? extra.task : null;
    const preview = detailTask ? (detailTask.body || "") : (task.body_preview || "");
    s3.appendChild(el("pre", "body", preview || "(body kosong)"));
    if (detailTask && detailTask.body_truncated) {
      s3.appendChild(el("div", "muted", "Body task dipotong di sini."));
    } else if (!detailTask && task.body_truncated) {
      s3.appendChild(el("div", "muted", "Ringkasan dipotong — body penuh menyusul di bawah."));
    }
    body.appendChild(s3);

    if (detailTask) {
      const sc = section("Aktivitas (komentar & event)");
      sc.appendChild(timeline(detailTask));
      body.appendChild(sc);

      if (detailTask.runs && detailTask.runs.length) {
        const sr = section("Run worker");
        for (const run of detailTask.runs) {
          const line = el("div", "ev");
          line.appendChild(el("b", null, "run #" + run.id + " " + (run.status || "")));
          line.appendChild(document.createTextNode(
            " · " + (run.profile || "-") + (run.outcome ? " · " + run.outcome : "") +
            " · mulai " + rel(run.started_at)));
          sr.appendChild(line);
        }
        body.appendChild(sr);
      }
    } else {
      const sl = section("Menyiapkan detail");
      const sk = el("div");
      sk.appendChild(el("div", "sk", ""));
      sl.appendChild(sk);
      sl.querySelector(".sk").style.height = "54px";
      sl.appendChild(el("div", "muted", "Mengambil body penuh, komentar, dan event…"));
      body.appendChild(sl);
    }

    const sr2 = section("Hubungan task");
    sr2.appendChild(kv([
      ["induk", (task.parents || []).join(", ") || "-"],
      ["lanjutan", (task.children || []).join(", ") || "-"],
    ]));
    body.appendChild(sr2);
  }

  async function openDetail(id, trigger, keepScroll) {
    state.detailId = id;
    state.lastFocus = trigger || state.lastFocus;
    const scrollTop = keepScroll ? $("sheetBody").scrollTop : 0;
    $("sheetWrap").hidden = false;
    try { if (!keepScroll) renderDetail(taskById(id) || { id, title: "Task " + id }, null); }
    catch (e) { /* kartu mungkin sudah tidak ada setelah refresh */ }
    if (!keepScroll) $("sheetClose").focus();
    try {
      const data = await fetchJSON("/api/agents/task?slug=" + encodeURIComponent(state.slug) +
                                   "&id=" + encodeURIComponent(id));
      if (data && data.task && state.detailId === id) {
        renderDetail(data.task, data);
        $("sheetBody").scrollTop = scrollTop;
      }
    } catch (e) {
      if (state.detailId !== id) return;
      const s = section("Gagal memuat detail");
      s.appendChild(el("div", "muted", e && e.message ? e.message : String(e)));
      $("sheetBody").appendChild(s);
    }
  }

  function closeDetail() {
    state.detailId = "";
    state.detail = null;
    $("sheetWrap").hidden = true;
    $("sheetBody").innerHTML = "";
    if (state.lastFocus && document.contains(state.lastFocus)) state.lastFocus.focus();
    state.lastFocus = null;
  }

  // ---------------- aksi board ----------------
  async function createTask(opts) {
    opts = opts || {};
    const target = opts.target || (opts.prefill && opts.prefill.status) || "ready";
    if (target === "todo") {
      await ask({
        title: "Task baru di Todo",
        intro: "Kolom Todo tidak bisa diisi langsung: task lahir di Todo hanya kalau punya induk yang belum selesai " +
               "(dependency). Buat task biasa dulu, lalu tautkan sebagai anak, atau pakai Block dengan jenis dependency.",
        fields: [],
        submit: "Mengerti",
        cancelLabel: "Tutup",
      });
      return;
    }
    if (target === "running") {
      await ask({
        title: "Task baru di Running",
        intro: "Running hanya diisi worker yang benar-benar berjalan. Buat task di Ready dan biarkan dispatcher gateway " +
               "yang mengambilnya — kartu akan berpindah ke Running sendiri.",
        fields: [],
        submit: "Mengerti",
        cancelLabel: "Tutup",
      });
      return;
    }
    if (!state.assignees.length) await loadAssignees(true);
    const names = state.assignees.map((a) => ({ value: a.name, label: a.name }));
    const prefill = opts.prefill || {};
    const chained = target !== "ready" && target !== "triage";
    const defaultAssignee = chained ? "" :
      (names.some((n) => n.value === "default") ? "default" : (names[0] ? names[0].value : ""));
    const chainNote = chained
      ? "Task dibuat di Ready lalu langsung dipindahkan ke " + label(target) + "."
      : "Task masuk Ready dan langsung diambil dispatcher gateway.";
    const v = await ask({
      title: target === "triage" ? "Task baru di Triage" : "Task baru",
      intro: (state.assigneeNote ? state.assigneeNote + "\n" : "") + chainNote,
      fields: [
        { name: "title", label: "Judul", type: "text", required: true, maxlength: 200,
          value: prefill.title || "",
          placeholder: "mis. Buat file hello.txt berisi halo" },
        { name: "body", label: "Deskripsi", type: "textarea", rows: 4, maxlength: 20000,
          value: prefill.body || "",
          placeholder: "Konteks, batasan, dan cara verifikasi…" },
        { name: "assignee", label: "Assignee", type: "select", value: prefill.assignee || defaultAssignee,
          options: [{ value: "", label: "(tanpa assignee — tidak dijalankan)" }].concat(names),
          hint: chained ? "Dikosongkan supaya dispatcher tidak menjalankannya sebelum dipindah." :
            (names.length === 1 ? "Hanya ada satu profil worker; worker dijalankan oleh profil itu." : "") },
        { name: "priority", label: "Prioritas", type: "select", value: String(prefill.priority || 0),
          options: [0,1,2,3,4,5].map((n) => ({ value: String(n), label: PRIORITY_LABEL[n] })) },
        { name: "workspace", label: "Workspace", type: "select", value: "scratch",
          options: [
            { value: "scratch", label: "scratch — sementara, dihapus setelah selesai" },
            { value: "worktree", label: "worktree — git worktree" },
            { value: "dir", label: "dir — folder yang sudah ada (isi path)" },
          ] },
        { name: "path", label: "Path (untuk dir)", type: "text", value: "",
          placeholder: "/root/proyek", hint: "Wajib path absolut kalau workspace = dir." },
        { name: "triage", label: "Parkir di Triage (spesifikasi belum jelas)", type: "checkbox", value: target === "triage" },
      ],
      submit: "Buat task",
      validate: (x) => {
        if (!(x.title || "").trim()) return "Judul wajib diisi.";
        if (x.workspace === "dir" && !(x.path || "").trim().startsWith("/")) {
          return "Workspace dir butuh path absolut (diawali /).";
        }
        return "";
      },
    });
    if (!v) return;
    const workspace = v.workspace === "dir" ? "dir:" + (v.path || "").trim() : v.workspace;
    const body = {
      slug: state.slug,
      title: (v.title || "").trim(),
      body: v.body || "",
      assignee: v.assignee || "",
      priority: Number(v.priority || 0),
      workspace,
      triage: !!v.triage,
    };
    try {
      const res = await fetch("/api/agents/task-create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || !data.ok) {
        throw new Error((data && [data.error, data.detail].filter(Boolean).join(" — ")) || ("HTTP " + res.status));
      }
      toast(data.message || "Task dibuat.", "ok");
      state.freshId = data.id || "";
      await loadBoard().catch(() => {});
      paintUpdated(); paintError();
      const card = document.querySelector('.card[data-id="' + (data.id || "") + '"]');
      if (card) {
        card.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
        setTimeout(() => { state.freshId = ""; card.classList.remove("new"); }, 1800);
      }
      if (data.id) await applyCreateTarget(data.id, target, body.title);
    } catch (e) {
      toast("Gagal membuat task: " + (e && e.message ? e.message : e), "err");
    }
  }

  // Setelah `create`, kolom tujuan (selain Ready/Triage) dicapai lewat aksi baku.
  async function applyCreateTarget(id, target, title) {
    if (target === "done") {
      await act("complete", { id, result: "Dibuat sebagai selesai lewat Papan Kanban." }, null, { id, title });
    } else if (target === "blocked") {
      await act("block", { id, reason: "Ditandai blocked saat pembuatan lewat Papan Kanban.", kind: "needs_input" },
        null, { id, title });
    } else if (target === "review") {
      await act("review", { id, summary: "Dibuat untuk direview lewat Papan Kanban." }, null, { id, title });
    }
  }

  async function createBoard() {
    const v = await ask({
      title: "Board baru",
      intro: "Board punya queue dan workspace sendiri, terpisah dari board lain.",
      fields: [
        { name: "slug", label: "Slug", type: "text", required: true, maxlength: 64,
          placeholder: "mis. proyek-web", hint: "Huruf kecil, angka, - dan _ (maks 64)." },
        { name: "name", label: "Nama tampilan", type: "text", maxlength: 80, placeholder: "Proyek Web" },
      ],
      submit: "Buat board",
      validate: (x) => /^[a-z0-9][a-z0-9_-]{0,63}$/.test((x.slug || "").trim())
        ? "" : "Slug tidak valid: huruf kecil/angka/-/_ dan tidak diawali tanda hubung.",
    });
    if (!v) return;
    try {
      const res = await fetch("/api/agents/board-create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slug: (v.slug || "").trim().toLowerCase(), name: (v.name || "").trim() }),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || !data.ok) {
        throw new Error((data && [data.error, data.detail].filter(Boolean).join(" — ")) || ("HTTP " + res.status));
      }
      toast(data.message || "Board dibuat.", "ok");
      await loadBoards();
      state.slug = (data.board && data.board.slug) || state.slug;
      try { localStorage.setItem(LS_BOARD, state.slug); } catch {}
      renderBoards();
      await loadBoard().catch(() => {});
      paintUpdated(); paintError();
    } catch (e) {
      toast("Gagal membuat board: " + (e && e.message ? e.message : e), "err");
    }
  }

  async function dispatchPreview() {
    if (!state.slug) return;
    try {
      const data = await fetchJSON("/api/agents/dispatch-preview?slug=" + encodeURIComponent(state.slug));
      const p = data.preview || {};
      const lines = [];
      const list = (v) => (Array.isArray(v) ? (v.length ? v.join(", ") : "-") : (v === null || v === undefined ? "-" : String(v)));
      lines.push("board            : " + data.board);
      lines.push("reclaimed        : " + list(p.reclaimed));
      lines.push("promoted         : " + list(p.promoted));
      lines.push("spawned          : " + list(p.spawned));
      lines.push("skipped_unassigned: " + list(p.skipped_unassigned));
      lines.push("skipped_nonspawnable: " + list(p.skipped_nonspawnable));
      lines.push("auto_blocked     : " + list(p.auto_blocked));
      lines.push("stale            : " + list(p.stale));
      lines.push("rate_limited     : " + list(p.rate_limited));
      lines.push("");
      lines.push("Dry-run: tidak ada worker yang dijalankan. Dispatcher gateway yang");
      lines.push("benar-benar mengeksekusi task `ready` pada tick berikutnya.");
      await ask({ title: "Pratinjau dispatch (dry-run)", intro: lines.join("\n"),
        fields: [], submit: "Tutup", cancelLabel: "Tutup" });
    } catch (e) {
      toast("Gagal pratinjau dispatch: " + (e && e.message ? e.message : e), "err");
    }
  }

  function showShortcuts() {
    const wrap = el("div", "kbdList");
    const rows = [
      ["n", "Task baru"],
      ["/", "Fokus ke kotak pencarian"],
      ["Esc", "Tutup modal, menu, atau detail"],
      ["?", "Daftar pintasan ini"],
      ["Tab + Enter", "Buka kartu / jalankan tombol"],
    ];
    for (const [key, text] of rows) {
      const r = el("div", "r");
      r.appendChild(el("kbd", null, key));
      r.appendChild(el("span", null, text));
      wrap.appendChild(r);
    }
    return ask({ title: "Pintasan papan", body: wrap, fields: [], submit: "Tutup", cancelLabel: "Tutup" });
  }

  // ---------------- interaksi global ----------------
  function readFiltersIntoDOM() {
    $("q").value = state.q;
    $("fPrio").value = state.prio;
    $("fRun").checked = state.runningOnly;
  }

  function fillPriorityOptions() {
    const sel = $("fPrio");
    for (let n = 0; n <= 5; n++) {
      const op = el("option", null, "Prioritas " + PRIORITY_LABEL[n]);
      op.value = String(n);
      sel.appendChild(op);
    }
  }

  $("refresh").onclick = () => refresh(true);
  $("newTask").onclick = () => createTask({});
  $("newBoard").onclick = createBoard;
  $("dispatchPrev").onclick = dispatchPreview;
  $("colBtn").onclick = openColumnPicker;
  $("sheetClose").onclick = closeDetail;
  $("sheetBg").onclick = closeDetail;
  $("fReset").onclick = resetFilters;
  $("boardSel").onchange = (e) => {
    state.slug = e.target.value;
    state.filter = null;
    state.chipEls = null;
    try { localStorage.setItem(LS_BOARD, state.slug); } catch {}
    refresh(true);
  };

  let searchTimer = null;
  $("q").addEventListener("input", (e) => {
    state.q = e.target.value;
    saveFilters();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { paintChips(); renderBoard(); }, 120);
  });
  $("fWho").addEventListener("change", (e) => {
    state.who = e.target.value;
    saveFilters(); paintChips(); renderBoard();
  });
  $("fPrio").addEventListener("change", (e) => {
    state.prio = e.target.value;
    saveFilters(); paintChips(); renderBoard();
  });
  $("fRun").addEventListener("change", (e) => {
    state.runningOnly = e.target.checked;
    saveFilters(); paintChips(); renderBoard();
  });

  // Keyboard: capture phase, supaya Esc milik modal menang lebih dulu.
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    const typing = !!(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable));
    if (e.key === "Escape") {
      if (document.querySelector(".modalWrap")) return;      // modal menutup dirinya
      if (menuEl) { closeMenu(); return; }
      if (!$("sheetWrap").hidden) { closeDetail(); return; }
      if (typing && t.blur) t.blur();
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.querySelector(".modalWrap")) return;
    if (e.key === "n") { e.preventDefault(); createTask({}); }
    else if (e.key === "/") {
      e.preventDefault();
      $("q").focus();
      if ($("q").select) $("q").select();
    } else if (e.key === "?") {
      e.preventDefault();
      showShortcuts();
    }
  }, true);

  const mq = window.matchMedia("(max-width:760px)");
  const onMq = () => {
    const next = mq.matches;
    if (next === state.compact) return;
    state.compact = next;
    closeMenu();
    if (state.filter && !visibleCols().includes(state.filter)) state.filter = null;
    if (state.loaded) { paintChips(); renderBoard(); }
  };
  state.compact = mq.matches;
  if (mq.addEventListener) mq.addEventListener("change", onMq);
  else if (mq.addListener) mq.addListener(onMq);

  setInterval(() => { if (!document.hidden) refresh(false); }, REFRESH_MS);
  setInterval(() => { if (!document.hidden && !state.error) paintUpdated(); }, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(true); });

  // ---------------- boot ----------------
  fillPriorityOptions();
  readCols();
  readFilters();
  readFiltersIntoDOM();
  renderAssigneeFilter();
  renderSkeleton();
  refresh(true);
})();
</script>
</body>
</html>
