<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hermes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kanban Agen Worker — Hermes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1115'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%237aa2f7'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --bg2:#161a21; --bg3:#1d222b; --line:#262c37;
    --fg:#e6e9ef; --dim:#8b93a1; --acc:#7aa2f7; --acc2:#bb9af7;
    --ok:#9ece6a; --warn:#e0af68; --err:#f7768e; --radius:12px;
  }
  *{box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#333d52 transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:#2c3549;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
  :focus-visible{outline:2px solid var(--acc); outline-offset:1px}
  ::selection{background:#33517f; color:#fff}
  [hidden]{display:none!important}
  body{
    margin:0; background:var(--bg); color:var(--fg); overflow-x:hidden;
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  #papan{display:block}

  /* ---------- kepala lengket ---------- */
  .head{position:sticky; top:0; z-index:6; background:var(--bg2); border-bottom:1px solid var(--line)}
  .top{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:9px 12px; background:var(--bg2); border-bottom:1px solid var(--line);
  }
  .top h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.01em; white-space:nowrap}
  .spacer{flex:1}
  nav.pages{
    display:flex; align-items:stretch; border:1px solid var(--line); border-radius:8px;
    overflow:hidden; background:var(--bg3);
  }
  nav.pages a{
    font-size:12.5px; color:var(--dim); text-decoration:none; padding:7px 10px;
    min-height:34px; display:inline-flex; align-items:center; white-space:nowrap;
  }
  nav.pages a + a{border-left:1px solid var(--line)}
  nav.pages a:hover{color:#fff; background:#202839}
  nav.pages a[aria-current="page"]{color:#fff; background:#1b2740}
  .icon{
    font:inherit; font-size:15px; line-height:1; color:var(--fg); background:var(--bg3);
    border:1px solid var(--line); border-radius:8px; width:38px; height:38px; cursor:pointer;
    flex:none;
  }
  .icon:hover{border-color:var(--acc); color:#fff}
  .icon.busy{opacity:.5}
  .btn{
    font:inherit; font-size:13px; color:var(--fg); background:var(--bg3);
    border:1px solid var(--line); border-radius:9px; padding:8px 11px; min-height:38px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{border-color:var(--acc); color:#fff}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.primary{background:var(--acc); border-color:var(--acc); color:#0b1020; font-weight:600}
  .btn.primary:hover{background:#8fb2ff; color:#0b1020}
  .btn.primary:disabled:hover{background:var(--acc)}
  .btn.danger{color:var(--err); border-color:#5c2b35; background:#1d1418}
  .btn.danger:hover{border-color:var(--err); color:#ffd0d8}
  .btn.sm{font-size:12px; padding:6px 9px; min-height:32px}
  .btn.big{font-size:14px; padding:12px 16px; min-height:46px; border-radius:11px; font-weight:600}
  .btn.on{background:#1b2740; border-color:var(--acc); color:#fff}
  .btn .kbd{font:11px ui-monospace,monospace; color:var(--dim); border:1px solid var(--line);
    border-radius:4px; padding:0 4px; margin-left:2px}
  body.mutating .btn[data-mut], body.mutating .cbtn{pointer-events:none}

  .bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 12px; background:var(--bg2)}
  .bar .lb{font-size:11.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em}
  select, input[type=text], input[type=number], textarea{
    font:inherit; font-size:13.5px; color:var(--fg); background:var(--bg3);
    border:1px solid var(--line); border-radius:9px; padding:9px 10px; min-height:40px;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--acc)}
  .bar select{flex:1; min-width:0; max-width:100%}
  .live{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); min-width:0}
  .live #updated{white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--ok)} .dot.off{background:var(--err)} .dot.busy{background:var(--warn)}

  /* ---------- pencarian & filter ---------- */
  .tools{
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
    padding:8px 12px 9px; background:var(--bg2); border-top:1px solid var(--line);
  }
  .search{position:relative; display:flex; align-items:center; flex:1 1 240px; min-width:0}
  .search .sicon{position:absolute; left:10px; color:var(--dim); font-size:14px; pointer-events:none}
  .search input{
    width:100%; padding-left:30px; padding-right:34px; min-height:38px; font-size:13px;
    background:var(--bg3);
  }
  .search kbd{
    position:absolute; right:9px; font:11px ui-monospace,monospace; color:var(--dim);
    border:1px solid var(--line); border-radius:5px; padding:0 5px; background:#12161d; pointer-events:none;
  }
  .tools select{flex:0 1 auto; min-width:0; max-width:180px; min-height:38px; font-size:12.5px; padding:7px 8px}
  .tgl{
    display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--dim);
    border:1px solid var(--line); border-radius:9px; padding:7px 10px; min-height:38px;
    background:var(--bg3); cursor:pointer; user-select:none; white-space:nowrap;
  }
  .tgl input{width:16px; height:16px; accent-color:var(--acc); margin:0}
  .tgl:hover{border-color:var(--acc)}
  .tgl:has(input:checked){color:#fff; border-color:var(--acc); background:#1b2740}

  /* ---------- chip ringkasan / filter ---------- */
  .chips{display:flex; flex-wrap:wrap; gap:6px; padding:9px 12px 4px; background:var(--bg2); border-bottom:1px solid var(--line)}
  .chip{
    display:inline-flex; align-items:center; gap:6px; min-height:34px; padding:6px 11px;
    font:13px/1 inherit; color:var(--dim); background:var(--bg3);
    border:1px solid var(--line); border-radius:999px; cursor:pointer;
  }
  .chip b{color:var(--fg); font-weight:600}
  .chip .zero{opacity:.55}
  .chip:hover{border-color:var(--acc); color:var(--fg)}
  .chip[aria-pressed="true"]{background:#1b2740; border-color:var(--acc); color:#fff}
  .swatch{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim)}
  .chipNote{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:11.5px; color:var(--dim); padding:2px 12px 8px; background:var(--bg2);
    border-bottom:1px solid var(--line); margin:0; min-height:26px;
  }
  .chipNote .res{color:var(--fg)}
  .linkBtn{
    font:inherit; font-size:11.5px; color:var(--acc); background:none; border:none;
    padding:2px 0; cursor:pointer; text-decoration:underline; text-underline-offset:2px;
  }

  .errbar{
    margin:8px 12px 0; padding:9px 11px; border:1px solid var(--err); border-radius:9px;
    background:#241419; color:#ffc9d2; font-size:12.5px; overflow-wrap:anywhere;
  }

  /* ---------- papan ---------- */
  main{padding:10px 12px 30px}
  .cols{
    display:grid; grid-auto-flow:column; grid-auto-columns:minmax(240px,1fr); gap:10px;
    overflow-x:auto; overscroll-behavior-x:contain; padding-bottom:8px; align-items:start;
  }
  /* Kalau semua kolom masih muat di lebar layar, paskan supaya tidak perlu
     scroll horizontal sama sekali (7 kolom di 1400px tetap terbaca). */
  .cols.fit{grid-auto-flow:row; grid-template-columns:repeat(var(--n,7),minmax(0,1fr)); overflow-x:visible}
  .col{
    background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; min-width:0; min-height:130px;
    transition:border-color .12s ease, background .12s ease;
  }
  .col.over{border-color:var(--acc); background:#141d2b; box-shadow:inset 0 0 0 1px #7aa2f766}
  .col.nodrop .colBody{opacity:.6}
  .colHead{
    display:flex; align-items:center; gap:7px; padding:8px 8px 8px 10px; border-bottom:1px solid var(--line);
    background:var(--bg2); border-radius:var(--radius) var(--radius) 0 0;
  }
  .colHead .sw{width:8px;height:8px;border-radius:50%;flex:none}
  .colHead .nm{font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--fg)}
  .colHead .ct{margin-left:auto; font-size:11.5px; color:var(--dim); background:var(--bg3);
    border:1px solid var(--line); border-radius:999px; padding:1px 7px; min-width:24px; text-align:center}
  .cadd{
    font:inherit; font-size:14px; line-height:1; color:var(--dim); background:transparent;
    border:1px solid var(--line); border-radius:7px; width:26px; height:26px; cursor:pointer; flex:none;
  }
  .cadd:hover{color:#fff; border-color:var(--acc); background:#1b2740}
  .colBody{
    display:flex; flex-direction:column; gap:8px; padding:9px; min-height:86px;
    max-height:calc(100dvh - 300px); overflow-y:auto;
  }
  .colEmpty{
    border:1px dashed var(--line); border-radius:9px; padding:14px 10px; text-align:center;
    font-size:12px; color:var(--dim); line-height:1.5;
  }
  .colEmpty .dd{display:block; font-size:11px; opacity:.75; margin-top:3px}

  /* mode ringkas: daftar satu kolom */
  .list{display:flex; flex-direction:column; gap:8px}
  .list .card{max-width:100%}

  /* ---------- kartu ---------- */
  .card{
    position:relative; background:var(--bg3); border:1px solid var(--line); border-radius:10px;
    padding:9px 10px; cursor:pointer; text-align:left; color:var(--fg); display:block; width:100%;
    transition:border-color .12s ease, box-shadow .12s ease, transform .08s ease;
  }
  .card:hover{border-color:var(--acc)}
  .card:hover .grip{opacity:1}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.4; box-shadow:0 12px 26px #000a; transform:scale(.99)}
  .card.run{border-color:#33517f; background:#18202d}
  .card.new{animation:flash 1.6s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 2px var(--acc)} 100%{box-shadow:0 0 0 0 transparent}}
  .ctop{display:flex; align-items:center; gap:6px; margin-bottom:5px; min-width:0}
  .badge{
    display:inline-flex; align-items:center; gap:5px; flex:none;
    font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--c,#8b93a1); background:#12161d; border:1px solid var(--line);
    border-radius:6px; padding:2px 6px;
  }
  .badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .badge.run .bd{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.3; transform:scale(.65)}}
  .prio{
    flex:none; border:1px solid var(--line); border-radius:5px; padding:1px 5px;
    font-size:10.5px; font-weight:600; color:var(--dim); background:#12161d;
  }
  .prio.p3{color:var(--warn); border-color:#4d3d20}
  .prio.p4,.prio.p5{color:var(--err); border-color:#5c2b35}
  .grip{
    margin-left:auto; color:var(--dim); font-size:12px; letter-spacing:1px; opacity:0;
    transition:opacity .12s ease; cursor:grab; flex:none;
  }
  .cbtn{
    font:inherit; font-size:15px; line-height:1; color:var(--dim); background:transparent;
    border:1px solid transparent; border-radius:6px; width:26px; height:24px; cursor:pointer; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .cbtn:hover{color:#fff; border-color:var(--acc); background:#1b2740}
  .grip + .cbtn{margin-left:2px}
  .ttl{
    font-size:13.5px; line-height:1.4; overflow-wrap:anywhere;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .cmeta{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:7px; font-size:11.5px; color:var(--dim)}
  .who{display:inline-flex; align-items:center; gap:5px; min-width:0; color:var(--acc2);
    font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere}
  .avatar{
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    width:17px; height:17px; border-radius:50%; background:#24314a; color:#cfe0ff;
    font:9.5px/1 ui-monospace,monospace; font-weight:700; text-transform:uppercase;
  }
  .when{margin-left:auto; white-space:nowrap}
  .cfoot{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:6px}
  .tag{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--dim);
    border:1px solid var(--line); border-radius:999px; padding:2px 7px; background:#12161d;
  }
  .tag.live{color:#cfe0ff; border-color:#33517f; background:#1b2740}
  .tag.warn{color:#ffd9a8; border-color:#4d3d20; background:#241d10}
  .tag.rev{color:#f6e3c4; border-color:#5c4a22; background:#25200f}

  /* ---------- menu pindahkan ---------- */
  .menu{
    position:fixed; z-index:60; width:min(300px,calc(100vw - 20px)); max-height:min(70vh,420px);
    overflow-y:auto; background:var(--bg2); border:1px solid #33517f; border-radius:11px;
    box-shadow:0 16px 40px #000c; padding:5px;
  }
  .menuH{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); padding:5px 8px 6px}
  .menuItem{
    display:block; width:100%; text-align:left; font:inherit; font-size:13px; color:var(--fg);
    background:transparent; border:1px solid transparent; border-radius:8px; padding:7px 8px;
    cursor:pointer;
  }
  button.menuItem:hover{background:#1b2740; border-color:var(--acc)}
  .menuItem .miName{display:flex; align-items:center; gap:6px; font-weight:600}
  .menuItem .miAct{display:block; font-size:11px; color:var(--dim); margin-top:1px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .menuItem.dis{cursor:not-allowed; opacity:.62}
  .menuItem.dis .miName{color:var(--dim)}
  .menuItem.dis .miAct{color:#a0685f}

  /* ---------- empty state & onboarding ---------- */
  .empty{color:var(--dim); text-align:center; padding:7vh 12px 0; font-size:14px; overflow-wrap:anywhere}
  .empty b{color:var(--fg); display:block; margin-bottom:6px; font-size:15px}
  .onboard{
    max-width:640px; margin:2vh auto 0; background:var(--bg2); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px 18px 20px;
  }
  .onboard h2{margin:0 0 4px; font-size:17px}
  .onboard .lead{margin:0 0 14px; color:var(--dim); font-size:13px}
  .steps{list-style:none; margin:0 0 16px; padding:0; display:flex; flex-direction:column; gap:9px}
  .steps li{display:flex; gap:10px; align-items:flex-start; background:var(--bg3);
    border:1px solid var(--line); border-radius:10px; padding:10px 11px}
  .steps .n{
    flex:none; width:22px; height:22px; border-radius:50%; background:#1b2740; color:#cfe0ff;
    font:12px/22px ui-monospace,monospace; text-align:center; font-weight:700; border:1px solid #33517f;
  }
  .steps b{display:block; font-size:13.5px}
  .steps span{display:block; font-size:12px; color:var(--dim); margin-top:2px}
  .onboard .obFoot{display:flex; flex-wrap:wrap; gap:8px; align-items:center}

  /* ---------- skeleton ---------- */
  .sk{background:linear-gradient(90deg,#1b2029 25%,#232a36 37%,#1b2029 63%);
    background-size:400% 100%; animation:shimmer 1.3s ease-in-out infinite; border-radius:8px}
  @keyframes shimmer{0%{background-position:100% 0} 100%{background-position:0 0}}
  .skCol{background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius); padding:9px;
    display:flex; flex-direction:column; gap:8px; min-width:0}
  .skHead{height:12px; width:52%; margin:2px 2px 4px}
  .skCard{height:74px}

  /* ---------- sheet detail ---------- */
  .sheetWrap{position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center}
  .sheet{
    position:relative; width:100%; max-width:820px; max-height:92vh; display:flex; flex-direction:column;
    background:var(--bg2); border:1px solid var(--line); border-bottom:none;
    border-radius:16px 16px 0 0; box-shadow:0 -14px 40px #0009;
  }
  .sheetBg{position:absolute; inset:0; background:#000a}
  .sheet header{display:flex; align-items:flex-start; gap:10px; padding:12px 13px 9px; border-bottom:1px solid var(--line)}
  .sheet h2{margin:0; font-size:15px; line-height:1.4; overflow-wrap:anywhere; min-width:0; flex:1}
  .sheet .shBody{overflow-y:auto; padding:12px 13px 26px; overflow-wrap:anywhere}
  .shTop{display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin:0 0 9px}
  .shSum{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--dim);
    background:var(--bg3); border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin:0 0 13px}
  .shSum .v{color:var(--fg)}
  .shSum .idrow{display:inline-flex; align-items:center; gap:6px; min-width:0}
  .shSum .idrow code{font:12px ui-monospace,monospace; color:var(--acc2); overflow-wrap:anywhere}
  .shSum .mini{
    font:11px ui-monospace,monospace; color:var(--acc); background:#12161d; border:1px solid var(--line);
    border-radius:6px; padding:2px 6px; cursor:pointer; min-height:0;
  }
  .shSum .mini:hover{border-color:var(--acc); color:#fff}
  .acts{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 14px}
  .acts.primary .btn.big{flex:1 1 190px}
  .sec{margin:0 0 15px}
  .sec h3{margin:0 0 7px; font:11.5px/1 inherit; text-transform:uppercase; letter-spacing:.07em; color:var(--dim)}
  .moves{display:flex; flex-direction:column; gap:5px}
  .mv{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; font:inherit; font-size:13px;
    color:var(--fg); background:var(--bg3); border:1px solid var(--line); border-radius:9px;
    padding:9px 10px; cursor:pointer; min-height:42px;
  }
  .mv:hover:not(:disabled){border-color:var(--acc); background:#1b2740}
  .mv:disabled{opacity:.55; cursor:not-allowed}
  .mv .mvName{font-weight:600; flex:none}
  .mv .mvWhy{font-size:11.5px; color:var(--dim); margin-left:auto; text-align:right; overflow-wrap:anywhere}
  .mv:disabled .mvWhy{color:#a0685f}
  .kv{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px}
  .kv .k{color:var(--dim)}
  .mono{
    font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; background:#0c0f14;
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; overflow-wrap:anywhere;
    white-space:pre-wrap;
  }
  .pathrow{display:flex; gap:7px; align-items:flex-start; flex-wrap:wrap}
  .pathrow .mono{flex:1; min-width:180px}
  .copy{
    font:12px ui-monospace,monospace; padding:7px 10px; min-height:36px; color:var(--fg);
    background:var(--bg3); border:1px solid var(--line); border-radius:8px; cursor:pointer;
  }
  .copy:hover{border-color:var(--acc); color:#fff}
  pre.body{
    margin:0; padding:10px 11px; background:#0c0f14; border:1px solid var(--line); border-radius:9px;
    font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap; overflow-wrap:anywhere; max-height:40vh; overflow-y:auto;
  }
  .tl{border-left:2px solid var(--line); margin:0 0 0 4px; padding:0 0 0 11px; display:flex; flex-direction:column; gap:10px}
  .tl .it{position:relative}
  .tl .it::before{content:""; position:absolute; left:-16px; top:6px; width:7px; height:7px;
    border-radius:50%; background:var(--line); border:1px solid var(--bg2)}
  .tl .it.cmt::before{background:var(--acc2)}
  .tl .it.ev::before{background:#3d4a63}
  .tl .h{font-size:11.5px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .tl .h b{color:var(--acc2); font-weight:600}
  .tl .b{font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; margin-top:2px}
  .ev{font:12px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim); padding:3px 0; overflow-wrap:anywhere}
  .ev b{color:var(--fg); font-weight:600}
  .muted{color:var(--dim); font-size:12.5px}
  a{color:var(--acc)}

  /* ---------- modal internal (bukan confirm/prompt bawaan) ---------- */
  .modalWrap{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:14px}
  .modalBg{position:absolute; inset:0; background:#000b}

    position:relative; width:100%; max-width:520px; max-height:88vh; overflow-y:auto;

  .modal h2{margin:0 0 4px; font-size:15px}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:70;

  #toast.err{background:#2a161c; border-color:#6d2b39; color:#ffd0d8}
  #toast .tact{
    font:inherit; font-size:12px; font-weight:600; color:#0b1020; background:var(--acc);
    border:1px solid var(--acc); border-radius:7px; padding:5px 9px; cursor:pointer; flex:none;
  }
  #toast .tact:hover{background:#8fb2ff}
  #toast .tact:disabled{opacity:.6; cursor:wait}

  @media (max-width:760px){
    .top{padding:8px 10px; gap:6px}
    .top h1{font-size:14px}

    .search{flex:1 1 100%}
    .chips{padding:8px 10px 6px; flex-wrap:nowrap; overflow-x:auto; overscroll-behavior-x:contain}
    .chip{flex:0 0 auto}
    .chipNote{padding:2px 10px 8px}
    main{padding:8px 10px 26px}
    .colBody{max-height:none}
    .btn{padding:7px 9px; min-height:36px; font-size:12.5px}

    .sheet{max-height:94vh}
    .acts.primary .btn.big{flex:1 1 100%}
    #toast{bottom:10px; font-size:12px}
  }
  /* ---------- mobile (<900px) ---------- */
  @media (max-width:899.98px){
    .top{padding:calc(8px + var(--safe-t)) 10px 8px; gap:6px}
    .top h1{font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis}
    /* aksi utama pindah ke baris kedua supaya judul tidak terhimpit */

    .bar .lb{display:none}

    .search{flex:1 1 100%}
    .search input{min-height:44px; font-size:16px}

    .chips .chip{flex:0 0 auto; min-height:44px; display:inline-flex; align-items:center}
    main{padding:8px 10px 10px}
    .colBody{max-height:calc(100dvh - 300px - var(--tabbar-h))}
    .card{padding:11px 10px 10px}
    /* drag-and-drop HTML5 tidak jalan di layar sentuh: grip jadi penanda visual,

    .shTop .btn{padding:10px 10px}
    .acts.primary{position:sticky; bottom:0; background:var(--bg2); padding-top:8px}
    /* dialog ask() → bottom sheet penuh */

      padding:18px 16px calc(16px + var(--safe-b)); animation:sheet-up .22s cubic-bezier(.22,.9,.24,1) both}
