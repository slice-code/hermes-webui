<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workspace — Hermes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1115'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%237aa2f7'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --bg2:#161a21; --bg3:#1d222b; --line:#262c37;
    --fg:#e6e9ef; --dim:#8b93a1; --acc:#7aa2f7; --acc2:#bb9af7;
    --ok:#9ece6a; --warn:#e0af68; --err:#f7768e; --radius:12px;
    /* warna state kantor: kerja hijau, nganggur biru, terhenti merah, selesai abu */
    --working:#9ece6a; --idle:#7aa2f7; --blocked:#f7768e; --done:#8b93a1; --offline:#5b6472;
  }
  *{box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#333d52 transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:#2c3549;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
  :focus-visible{outline:2px solid var(--acc); outline-offset:1px}
  ::selection{background:#33517f; color:#fff}
  body{
    margin:0; background:var(--bg); color:var(--fg); overflow-x:clip;
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- kepala lengket (satu blok: .top + .bar) ---------- */
  .head{position:sticky; top:0; z-index:6; background:var(--bg2); border-bottom:1px solid var(--line)}
  .top{display:flex; align-items:center; gap:8px; row-gap:7px; flex-wrap:wrap; padding:9px 12px;
       background:var(--bg2); border-bottom:1px solid var(--line)}
  .top h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.01em; white-space:nowrap}
  .spacer{flex:1}
  .pages{display:flex; align-items:stretch; border:1px solid var(--line); border-radius:9px;
         overflow:hidden; background:var(--bg3)}
  .pages a{font-size:12.5px; color:var(--dim); text-decoration:none; padding:8px 11px; min-height:36px;
           display:inline-flex; align-items:center; white-space:nowrap}
  .pages a + a{border-left:1px solid var(--line)}
  .pages a:hover{color:#fff; background:#202839}
  .pages a[aria-current="page"]{color:#fff; background:#1b2740}
  .icon{font:inherit; font-size:15px; line-height:1; color:var(--fg); background:var(--bg3);
        border:1px solid var(--line); border-radius:8px; width:38px; height:38px; cursor:pointer}
  .icon:hover{border-color:var(--acc); color:#fff}
  .icon.busy{opacity:.5}

  .bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 12px; background:var(--bg2)}
  .bar .lb{font-size:11.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em}
  select{flex:1; min-width:0; max-width:100%; font:inherit; font-size:13.5px; color:var(--fg);
         background:var(--bg3); border:1px solid var(--line); border-radius:9px; padding:9px 10px; min-height:40px}
  select:focus{border-color:var(--acc)}
  .live{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); min-width:0}
  .live #updated{white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--ok); animation:beat 2s ease-in-out infinite}
  .dot.off{background:var(--err)}
  @keyframes beat{0%,100%{opacity:1} 50%{opacity:.3}}

  .errbar{margin:8px 12px 0; padding:9px 11px; border:1px solid var(--err); border-radius:9px;
          background:#241419; color:#ffc9d2; font-size:12.5px; overflow-wrap:anywhere}

  main{padding:10px 12px 30px; max-width:900px; margin:0 auto}
  /* Lebar ruangan dibatasi supaya seluruh ruangan (termasuk sudut kopi & pintu
     di baris bawah) tetap masuk layar di desktop tanpa dipotong. */
  #workspace-room{max-width:660px; margin:0 auto; background:#12161f; border:1px solid var(--line);
                  border-radius:var(--radius); overflow:hidden}
  #workspace-room svg{display:block; width:100%; height:auto}
  #workspace-room text{font:10px ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}

  /* ---------- karakter ---------- */
  .char{transition:transform .7s ease}
  .char.hidden{display:none}
  .char .stand-only{display:none}
  .char.away .stand-only{display:inline}
  .char .torso{transition:fill .4s}
  .char.working .torso{fill:#2f7a52}
  .char.blocked .torso{fill:#7a3344}
  .char.done .torso{fill:#3c4658}
  .char.idle .torso{fill:#33405c}
  .char.working .arm{animation:type .36s steps(2) infinite alternate}
  .char.working .arm.r{animation-direction:alternate-reverse}
  .char.working .torso,.char.working .head{animation:bob .8s steps(2) infinite alternate}
  .char.idle .torso,.char.idle .head,.char.idle .arm,.char.idle .stand-only{animation:wander 7s ease-in-out infinite alternate}
  @keyframes type{from{transform:translateY(0)} to{transform:translateY(-2.4px)}}
  @keyframes bob{from{transform:translateY(0)} to{transform:translateY(-1.6px)}}
  @keyframes wander{from{transform:translateX(0)} to{transform:translateX(9px)}}
  .cell .screen{fill:#1b2433; transition:fill .4s}
  .cell.st-working .screen{fill:#7aa2f7; animation:glow 1.7s ease-in-out infinite alternate}
  @keyframes glow{from{opacity:.55} to{opacity:1}}
  .cell{cursor:pointer}
  .cell:focus-visible{outline:2px solid var(--acc)}
  .cell .state{font-weight:600}
  .st-working .state{fill:var(--working)}
  .st-idle .state{fill:var(--idle)}
  .st-blocked .state{fill:var(--blocked)}
  .st-done .state{fill:var(--done)}
  .st-offline .state{fill:var(--offline)}
  .bub{stroke-width:1}
  .bub.working{fill:#16281f; stroke:#3d5a2a}
  .bub.blocked{fill:#2a161c; stroke:#6d2b39}
  .bub.done{fill:#1a1f28; stroke:#4a5462}
  .bub.idle{fill:#141b26; stroke:#2f4667}
  .bubtext{fill:#e6e9ef; font-size:11px}
  .bubdot.working{fill:var(--working)}
  .bubdot.blocked{fill:var(--blocked)}
  .bubdot.done{fill:var(--done)}
  .bubdot.idle{fill:var(--idle)}
  .plate{fill:#9aa5b8; font-size:11px}
  .nametag{fill:#8b93a1; font-size:10px; display:none}
  .char.away .nametag{display:inline}

  /* ---------- legenda + roster ---------- */
  .legend{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0}
  .lg{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--dim);
      background:var(--bg3); border:1px solid var(--line); border-radius:999px; padding:5px 10px}
  .lg b{color:var(--fg); font-weight:600}
  .lg .sw{width:8px;height:8px;border-radius:50%;flex:none}

  details.roster{margin:12px 0 0; border:1px solid var(--line); border-radius:var(--radius);
                 background:var(--bg2); overflow:hidden}
  details.roster > summary{cursor:pointer; padding:11px 12px; font-size:13.5px; color:var(--fg);
                 min-height:44px; display:flex; align-items:center; gap:8px}
  details.roster > summary::marker{color:var(--dim)}
  .rsum{color:var(--dim); font-size:12px}
  .rlist{border-top:1px solid var(--line)}
  .rrow{display:flex; align-items:flex-start; gap:9px; width:100%; text-align:left; font:inherit;
        color:var(--fg); background:transparent; border:none; border-bottom:1px solid var(--line);
        padding:10px 12px; min-height:52px; cursor:pointer}
  .rrow:last-child{border-bottom:none}
  .rrow:hover{background:#1a2029}
  .rrow .sw{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
  .rrow .nm{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--acc2); overflow-wrap:anywhere}
  .rrow .ttl2{font-size:13.5px; line-height:1.4; overflow-wrap:anywhere; margin-top:2px;
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .rrow .stl{font-size:11.5px; font-weight:600}
  .rrow .when{margin-left:auto; font-size:11.5px; color:var(--dim); white-space:nowrap}
  .empty{color:var(--dim); text-align:center; padding:22px 12px; font-size:13.5px; overflow-wrap:anywhere}

  /* ---------- panel bawah (bottom sheet) ---------- */
  .sheetWrap{position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center}
  .sheetWrap[hidden]{display:none}
  .sheetBg{position:absolute; inset:0; background:#000a}
  .sheet{position:relative; width:100%; max-width:760px; max-height:86vh; display:flex; flex-direction:column;
         background:var(--bg2); border:1px solid var(--line); border-bottom:none;
         border-radius:14px 14px 0 0; box-shadow:0 -14px 40px #0009}
  .sheet header{display:flex; align-items:flex-start; gap:10px; padding:11px 13px; border-bottom:1px solid var(--line)}
  .sheet h2{margin:0; font-size:14.5px; line-height:1.4; overflow-wrap:anywhere; min-width:0; flex:1}
  .sheet .shBody{overflow-y:auto; padding:12px 13px 22px; overflow-wrap:anywhere}
  .sec{margin:0 0 14px}
  .sec h3{margin:0 0 6px; font:11.5px/1 inherit; text-transform:uppercase; letter-spacing:.07em; color:var(--dim)}
  .kv{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px}
  .kv .k{color:var(--dim)}
  .mono{font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; background:#0c0f14;
        border:1px solid var(--line); border-radius:8px; padding:8px 10px; overflow-wrap:anywhere}
  .acts{list-style:none; margin:0; padding:0}
  .acts li{font-size:12.5px; color:var(--fg); border-left:2px solid var(--line); padding:0 0 0 9px;
           margin:0 0 8px; overflow-wrap:anywhere}
  .acts li span{color:var(--dim)}
  .linkbtn{font:13px inherit; display:inline-flex; align-items:center; gap:6px; min-height:40px;
           color:var(--fg); background:var(--bg3); border:1px solid var(--line); border-radius:9px;
           padding:8px 12px; text-decoration:none; cursor:pointer}
  .linkbtn:hover{border-color:var(--acc); color:#fff}
  .closebtn{font:12px ui-monospace,monospace; padding:8px 11px; min-height:38px; color:var(--fg);
            background:var(--bg3); border:1px solid var(--line); border-radius:8px; cursor:pointer}
  .closebtn:hover{border-color:var(--acc); color:#fff}
  .muted{color:var(--dim); font-size:12.5px}
  a{color:var(--acc)}

  /* Animasi dihormati: kalau user minta gerak minimal, semua gerak berhenti —
     state tetap terbaca dari warna + label teks. */
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
<div class="head">
  <header class="top">
    <h1>Workspace</h1>
    <nav class="pages" aria-label="Navigasi halaman">
      <a href="/">Chat</a>
      <a href="/agents">Kanban</a>
      <a href="/workspace" aria-current="page">Workspace</a>
      <a href="/otomasi" title="Cron, skills, toolsets, status sistem">Otomasi</a>
    </nav>
    <span class="spacer"></span>
    <button class="icon" id="refresh" aria-label="Muat ulang sekarang" title="Muat ulang sekarang">⟳</button>
  </header>

  <div class="bar">
    <label class="lb" for="boardSel">Board</label>
    <select id="boardSel" aria-label="Pilih papan kanban"></select>
    <span class="live" aria-live="polite">
      <span class="dot" id="dot" aria-hidden="true"></span>
      <span id="updated">memuat…</span>
    </span>
  </div>
</div>

<div id="errbar"></div>

<main>
  <div id="workspace-room" aria-label="Kantor virtual: satu meja per agen"></div>
  <div class="legend" id="legend" role="group" aria-label="Arti warna status"></div>
  <details class="roster" id="roster" open>
    <summary>Daftar agen <span class="rsum" id="rosterSum"></span></summary>
    <div class="rlist" id="rlist"></div>
  </details>
</main>

<div class="sheetWrap" id="sheetWrap" hidden>
  <div class="sheetBg" id="sheetBg"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header>
      <h2 id="sheetTitle">Detail agen</h2>
      <button class="closebtn" id="sheetClose" aria-label="Tutup detail">Tutup ✕</button>
    </header>
    <div class="shBody" id="sheetBody"></div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // Sesi login bisa kedaluwarsa/dicabut di server: setiap 401 dari proxy berarti
  // cookie sudah tidak sah — lempar ke halaman login, jangan tampilkan error mentah.
  const _fetch = window.fetch.bind(window);
  window.fetch = (input, init) => _fetch(input, init).then((res) => {
    if (res.status === 401) {
      location.replace("/login?next=" + encodeURIComponent(location.pathname + location.search));
    }
    return res;
  });

  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const LS = "hermes-workspace-v1";
  const POLL_MS = 3000;                 // spec: polling 3 detik
  const STATE = {
    working: { label: "bekerja",  short: "kerja",    cls: "working", color: "var(--working)" },
    blocked: { label: "terhenti", short: "terhenti", cls: "blocked", color: "var(--blocked)" },
    done:    { label: "selesai",  short: "selesai",  cls: "done",    color: "var(--done)" },
    idle:    { label: "nganggur", short: "nganggur", cls: "idle",    color: "var(--idle)" },
    offline: { label: "offline",  short: "offline",  cls: "offline", color: "var(--offline)" },
  };
  const PRIO = ["working", "blocked", "done", "idle", "offline"];

  // Geometri ruangan (satuan viewBox; SVG menskala penuh, jadi tidak pernah
  // memunculkan scroll horizontal).
  const CELL_W = 140, CELL_H = 152, PAD = 24, WALL = 132, STRIP = 132;

  // 2 kolom meja di layar sempit, 3 kolom kalau layar cukup lebar.
  const cols = () => (window.innerWidth >= 560 ? 3 : 2);

  const state = {
    slug: "", boards: [], agents: [], counts: {}, boardName: "",
    generatedAt: 0, fetchedAt: 0, error: "", busy: false, layout: null,
    cols: cols(), serverOffsetMs: 0,
  };
  let lastFocus = null;

  // ---------------- util ----------------
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  };
  const svgEl = (tag, attrs, parent) => {
    const node = document.createElementNS(NS, tag);
    if (attrs) for (const key of Object.keys(attrs)) node.setAttribute(key, attrs[key]);
    if (parent) parent.appendChild(node);
    return node;
  };
  const svgText = (parent, text, attrs) => {
    const node = svgEl("text", attrs, parent);
    node.textContent = text;
    return node;
  };
  const stateInfo = (s) => STATE[s] || STATE.idle;

  function cut(text, max) {
    const t = String(text === undefined || text === null ? "" : text).trim();
    return t.length > max ? t.slice(0, max - 1).trimEnd() + "…" : t;
  }

  function rel(ts) {
    if (!ts) return "";
    const secs = Math.floor(Date.now() / 1000 - Number(ts));
    if (!isFinite(secs)) return "";
    if (secs < 5) return "baru saja";
    if (secs < 60) return secs + " dtk lalu";
    if (secs < 3600) return Math.floor(secs / 60) + " mnt lalu";
    if (secs < 86400) return Math.floor(secs / 3600) + " jam lalu";
    return Math.floor(secs / 86400) + " hari lalu";
  }

  // ---------------- data ----------------
  function readSaved() {
    try { return String(localStorage.getItem(LS) || ""); } catch { return ""; }
  }

  async function loadBoards() {
    const res = await fetch("/api/agents/boards", { cache: "no-store" });
    const data = await res.json().catch(() => null);
    if (!res.ok || !Array.isArray(data)) {
      throw new Error((data && (data.detail || data.error)) || ("HTTP " + res.status));
    }
    state.boards = data;
    const saved = readSaved();
    const pick = state.boards.find((b) => b.slug === saved) ||
                 state.boards.find((b) => b.current) ||
                 state.boards.find((b) => b.running_count > 0) ||
                 state.boards.find((b) => b.task_count > 0) ||
                 state.boards[0];
    state.slug = pick ? pick.slug : "";
    try { localStorage.setItem(LS, state.slug); } catch {}
    renderBoardOptions();
  }

  function renderBoardOptions() {
    const sel = $("boardSel");
    sel.innerHTML = "";
    for (const b of state.boards) {
      const opt = el("option", null, (b.name || b.slug) +
        (b.running_count > 0 ? " — " + b.running_count + " jalan" : ""));
      opt.value = b.slug;
      if (b.slug === state.slug) opt.selected = true;
      sel.appendChild(opt);
    }
  }

  async function loadLive() {
    if (!state.slug) {
      state.generatedAt = Math.floor(Date.now() / 1000);
      state.agents = [];
      state.counts = {};
      render();
      paintStatus();
      return;
    }
    const res = await fetch("/api/agents/live?slug=" + encodeURIComponent(state.slug),
                            { cache: "no-store" });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !Array.isArray(data.agents)) {
      throw new Error((data && (data.detail || data.error)) || ("HTTP " + res.status));
    }
    state.agents = data.agents;
    state.counts = data.counts || {};
    state.generatedAt = Number(data.generated_at) || Math.floor(Date.now() / 1000);
    state.fetchedAt = Date.now();
    state.serverOffsetMs = state.generatedAt * 1000 - state.fetchedAt;
    state.boardName = (data.board && (data.board.name || data.board.slug)) || state.slug;
    state.error = "";
    render();
    paintStatus();
  }

  async function refresh(manual) {
    if (state.busy && !manual) return;
    state.busy = true;
    $("refresh").classList.add("busy");
    try {
      if (!state.boards.length) await loadBoards();
      await loadLive();
      // Banner error WAJIB hilang begitu satu refresh sukses (state.error = ""),
      // kalau tidak pesan "terputus" bertahan walau data sudah segar.
      paintError();
    } catch (e) {
      state.error = "Terputus dari server: " + (e && e.message ? e.message : String(e));
      paintError();                       // ruangan TIDAK dikosongkan saat gagal
    } finally {
      state.busy = false;
      $("refresh").classList.remove("busy");
    }
  }

  // ---------------- status bar ----------------
  function paintStatus() {
    const age = state.fetchedAt ? Math.max(0, Math.floor((Date.now() - state.fetchedAt) / 1000)) : 0;
    setState("dot", state.error ? "dot off" : "dot on");
    $("updated").textContent = state.error
      ? (state.fetchedAt ? "terputus · data " + age + " dtk lalu" : "terputus")
      : (state.fetchedAt
          ? "live · diperbarui " + age + " dtk lalu · " + state.agents.length + " agen"
          : "memuat…");
  }

  function paintError() {
    const box = $("errbar");
    box.innerHTML = "";
    if (!state.error) return;
    box.appendChild(el("div", "errbar", "⚠ " + state.error + " — ruangan menampilkan data terakhir."));
  }

  const setState = (id, cls) => { $(id).setAttribute("class", cls); };

  // ---------------- bangun ruangan (sekali per layout) ----------------
  function buildRoom(agents, c) {
    const room = $("workspace-room");
    room.innerHTML = "";
    const rows = Math.max(1, Math.ceil(agents.length / c));
    const W = c * CELL_W + PAD * 2;
    const stripTop = WALL + rows * CELL_H;
    const H = stripTop + STRIP;

    const svg = svgEl("svg", {
      viewBox: "0 0 " + W + " " + H, width: "100%",
      preserveAspectRatio: "xMidYMid meet", role: "img",
      "aria-label": "Kantor virtual Hermes — satu meja per agen",
    }, room);
    const defs = svgEl("defs", null, svg);
    const tiles = svgEl("pattern", { id: "tiles", width: 26, height: 26, patternUnits: "userSpaceOnUse" }, defs);
    svgEl("rect", { width: 26, height: 26, fill: "#1c2331" }, tiles);
    svgEl("path", { d: "M0 0 H26 V26", fill: "none", stroke: "#232c3d", "stroke-width": 1 }, tiles);

    // dinding + lantai kotak-kotak
    svgEl("rect", { x: 0, y: 0, width: W, height: WALL, fill: "#19202e" }, svg);
    svgEl("rect", { x: 0, y: 0, width: W, height: 8, fill: "#141926" }, svg);
    svgEl("rect", { x: 0, y: WALL - 6, width: W, height: 6, fill: "#141a26" }, svg);
    svgEl("rect", { x: 0, y: WALL, width: W, height: H - WALL, fill: "url(#tiles)" }, svg);

    // papan tulis: nama board + hitungan
    const wbW = Math.min(180, Math.round(W * 0.5));
    svgEl("rect", { x: 18, y: 24, width: wbW, height: 76, rx: 4, fill: "#101722", stroke: "#2b3547" }, svg);
    const wbName = svgText(svg, "", { x: 18 + wbW / 2, y: 46, "text-anchor": "middle",
      "font-size": 13, "font-weight": 600, fill: "#e6e9ef" });
    const wbCounts = svgText(svg, "", { x: 18 + wbW / 2, y: 66, "text-anchor": "middle",
      "font-size": 11.5, fill: "#8b93a1" });
    const wbNote = svgText(svg, "", { x: 18 + wbW / 2, y: 84, "text-anchor": "middle",
      "font-size": 10, fill: "#6f7a8c" });
    const wbNoteTitle = svgEl("title", null, wbNote);   // "N task berjalan di board ini"

    // jendela malam: kusen + ambang, bulan sabit, dua bintang
    const winX = 18 + wbW + 14;
    const winW = Math.max(56, Math.min(92, W - winX - 62));
    svgEl("rect", { x: winX, y: 30, width: winW, height: 64, rx: 3, fill: "#0d1522",
      stroke: "#3a465c", "stroke-width": 2 }, svg);
    svgEl("line", { x1: winX + winW / 2, y1: 30, x2: winX + winW / 2, y2: 94, stroke: "#3a465c" }, svg);
    svgEl("line", { x1: winX, y1: 62, x2: winX + winW, y2: 62, stroke: "#3a465c" }, svg);
    svgEl("rect", { x: winX - 4, y: 94, width: winW + 8, height: 5, rx: 2, fill: "#26304a" }, svg);
    svgEl("circle", { cx: winX + winW - 21, cy: 47, r: 6.5, fill: "#e6e9ef", opacity: .85 }, svg);
    svgEl("circle", { cx: winX + winW - 17, cy: 43, r: 5, fill: "#0d1522" }, svg);
    svgEl("circle", { cx: winX + 15, cy: 44, r: 1.4, fill: "#c8cfdb" }, svg);
    svgEl("circle", { cx: winX + 27, cy: 78, r: 1.2, fill: "#c8cfdb" }, svg);

    // jam dinding (jarum digerakkan dari waktu server)
    const clkX = W - 30, clkY = 62;
    svgEl("circle", { cx: clkX, cy: clkY, r: 21, fill: "#0e1420", stroke: "#2b3547",
      "stroke-width": 2 }, svg);
    const hourHand = svgEl("line", { x1: clkX, y1: clkY, x2: clkX, y2: clkY - 11,
      stroke: "#e6e9ef", "stroke-width": 2.4, "stroke-linecap": "round" }, svg);
    const minHand = svgEl("line", { x1: clkX, y1: clkY, x2: clkX, y2: clkY - 15,
      stroke: "#7aa2f7", "stroke-width": 1.6, "stroke-linecap": "round" }, svg);
    svgEl("circle", { cx: clkX, cy: clkY, r: 1.7, fill: "#e6e9ef" }, svg);
    const clkText = svgText(svg, "", { x: clkX, y: 100, "text-anchor": "middle",
      "font-size": 9.5, fill: "#8b93a1" });

    // sudut kopi + tanaman
    svgEl("rect", { x: 24, y: stripTop + 40, width: 64, height: 20, rx: 3, fill: "#2b3448",
      stroke: "#37425c" }, svg);
    svgEl("rect", { x: 30, y: stripTop + 60, width: 4, height: 16, fill: "#232c3d" }, svg);
    svgEl("rect", { x: 78, y: stripTop + 60, width: 4, height: 16, fill: "#232c3d" }, svg);
    svgEl("rect", { x: 52, y: stripTop + 26, width: 11, height: 12, rx: 2, fill: "#e0af68" }, svg);
    svgEl("path", { d: "M63 " + (stripTop + 30) + " h4 a3 3 0 0 1 0 6 h-4", fill: "none",
      stroke: "#e0af68", "stroke-width": 1.4 }, svg);
    svgEl("rect", { x: 100, y: stripTop + 62, width: 15, height: 16, rx: 2, fill: "#7a4f35" }, svg);
    svgEl("circle", { cx: 107, cy: stripTop + 58, r: 8, fill: "#6f9f4f" }, svg);
    svgEl("circle", { cx: 100, cy: stripTop + 62, r: 6, fill: "#7fb069" }, svg);
    svgEl("circle", { cx: 114, cy: stripTop + 62, r: 6, fill: "#5d8a45" }, svg);

    // pintu (kanan bawah) + cahaya yang masuk
    svgEl("polygon", { points: [W - 150, stripTop + 96, W - 74, stripTop + 96,
      W - 74, stripTop + 74].join(" "), fill: "#7aa2f7", opacity: .05 }, svg);
    svgEl("rect", { x: W - 74, y: stripTop + 28, width: 58, height: 46, rx: 3, fill: "#202a3c",
      stroke: "#37425c" }, svg);
    svgEl("circle", { cx: W - 24, cy: stripTop + 51, r: 2.6, fill: "#8b93a1" }, svg);

    // meja per profil + karakter
    const cells = new Map();
    agents.forEach((agent, i) => {
      const col = i % c, row = Math.floor(i / c);
      const cellX = PAD + col * CELL_W, cellY = WALL + row * CELL_H;
      // cy = garis muka meja. Tinggi sel (CELL_H) memberi ruang untuk gelembung
      // status di atas kepala + pelat nama di bawah meja, jadi baris tidak
      // saling menimpa.
      const cx = cellX + CELL_W / 2, cy = cellY + 76;
      const info = stateInfo(agent.state);
      const g = svgEl("g", { class: "cell", tabindex: "0", role: "button" }, svg);
      const title = svgEl("title", null, g);
      svgEl("ellipse", { cx: cx, cy: cy + 36, rx: 52, ry: 7, fill: "#0b0f16", opacity: .55 }, g);
      // layar monitor (menyala saat bekerja) + keyboard + kursi + meja
      svgEl("rect", { x: cx + 22, y: cy - 26, width: 30, height: 20, rx: 2, fill: "#0d121b",
        stroke: "#37425c" }, g);
      const screen = svgEl("rect", { x: cx + 25, y: cy - 23, width: 24, height: 14, rx: 1.5,
        class: "screen" }, g);
      svgEl("rect", { x: cx + 34, y: cy - 6, width: 6, height: 6, fill: "#232c3d" }, g);
      svgEl("rect", { x: cx - 58, y: cy, width: 116, height: 20, rx: 3, fill: "#2b3448",
        stroke: "#37425c" }, g);
      svgEl("rect", { x: cx - 58, y: cy + 20, width: 116, height: 5, rx: 2, fill: "#232c3d" }, g);
      svgEl("rect", { x: cx - 14, y: cy + 7, width: 26, height: 4, rx: 1.5, fill: "#39435c" }, g);
      svgEl("rect", { x: cx - 15, y: cy + 31, width: 30, height: 6, rx: 3, fill: "#26304a" }, g);
      const plate = svgText(g, cut(agent.profile, 16), { x: cx, y: cy + 50, "text-anchor": "middle",
        class: "plate" });
      const stateText = svgText(g, info.label, { x: cx, y: cy + 64, "text-anchor": "middle",
        class: "state", "font-size": 10.5 });

      // karakter: satu grup per profil, dipindah dengan transform (meja / sudut kopi)
      const char = svgEl("g", { class: "char" }, svg);
      const stand = svgEl("g", { class: "stand-only" }, char);
      svgEl("rect", { x: -8, y: -14, width: 6, height: 14, rx: 2, fill: "#26304a" }, stand);
      svgEl("rect", { x: 2, y: -14, width: 6, height: 14, rx: 2, fill: "#26304a" }, stand);
      svgEl("rect", { x: -9, y: -2, width: 8, height: 3, rx: 1.5, fill: "#151b26" }, stand);
      svgEl("rect", { x: 1, y: -2, width: 8, height: 3, rx: 1.5, fill: "#151b26" }, stand);
      const nameTag = svgText(char, cut(agent.profile, 14), { x: 0, y: 16, "text-anchor": "middle",
        class: "nametag" });
      const torso = svgEl("rect", { x: -11, y: -30, width: 22, height: 22, rx: 6,
        class: "torso", fill: "#33405c" }, char);
      svgEl("rect", { x: -19, y: -22, width: 10, height: 4, rx: 2, class: "arm l",
        fill: "#e8c9a8" }, char);
      svgEl("rect", { x: 9, y: -22, width: 10, height: 4, rx: 2, class: "arm r",
        fill: "#e8c9a8" }, char);
      svgEl("rect", { x: -3, y: -32, width: 6, height: 4, fill: "#e0bd9e" }, char);
      svgEl("circle", { cx: 0, cy: -38, r: 8.5, class: "head", fill: "#f0d0b0" }, char);
      svgEl("rect", { x: -9, y: -47, width: 18, height: 8, rx: 4, fill: "#3a2f2a" }, char);
      const bub = svgEl("g", { class: "bubble" }, char);
      const bubRect = svgEl("rect", { x: -30, y: -73, width: 60, height: 18, rx: 5,
        class: "bub idle" }, bub);
      const bubText = svgText(bub, "", { x: 0, y: -60.5, "text-anchor": "middle",
        class: "bubtext" });
      const dot = svgEl("circle", { cx: -22, cy: -64, r: 3.5, class: "bubdot",
        fill: "#7aa2f7" }, bub);
      bub.appendChild(dot);

      cells.set(agent.profile, { g, char, screen, plate, stateText, title, nameTag,
        bubRect, bubText, bubDot: dot, cx, cy });
      g.addEventListener("click", () => openSheet(agent.profile, g));
      g.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(agent.profile, g); }
      });
    });

    // posisi karakter nganggur di sudut kopi (maks 6 slot; lebih dari itu
    // memakai slot yang sama supaya tidak keluar dari ruangan)
    const away = agents.filter((a) => a.state === "idle");
    const slots = Math.min(away.length, 6);
    const usable = Math.max(60, W - 100 - 140);
    away.forEach((agent, i) => {
      const cell = cells.get(agent.profile);
      if (!cell) return;
      const idx = i % 6;
      const step = slots > 1 ? Math.min(56, usable / (slots - 1)) : 0;
      cell.awayX = 140 + idx * step;
      // Gelembung karakter nganggur digeser naik-turun bergantian supaya tidak
      // saling menimpa saat karakternya berdiri berdampingan di sudut kopi.
      cell.awayY = stripTop + 80 + (idx % 2 ? 26 : 0);
    });

    return { svg, cells, W, H, cols: c, rows, stripTop, hourHand, minHand, clkText,
             wbName, wbCounts, wbNote, wbNoteTitle };
  }

  // ---------------- perbarui ruangan (tiap poll) ----------------
  function applyAgent(cell, agent) {
    const info = stateInfo(agent.state);
    cell.g.setAttribute("class", "cell st-" + agent.state);
    cell.stateText.textContent = info.label;
    cell.plate.textContent = cut(agent.profile, 16);
    cell.title.textContent = agent.profile + " — " + info.label +
      (agent.task_title ? ": " + agent.task_title : "");
    cell.g.setAttribute("aria-label", agent.profile + ", status " + info.label +
      (agent.task_title ? ", task " + agent.task_title : ""));

    // kelas karakter: animasi + posisi (meja vs sudut kopi)
    let cls = "char " + agent.state;
    if (agent.state === "offline") {
      cls += " hidden";
    } else if (agent.state === "idle") {
      cls += " away";
    } else {
      cls += " at-desk";
    }
    cell.char.setAttribute("class", cls);

    const awaySlot = cell.awayX !== undefined;
    if (agent.state === "idle" && awaySlot) {
      cell.char.setAttribute("transform", "translate(" + cell.awayX + "," + cell.awayY + ")");
    } else {
      cell.char.setAttribute("transform", "translate(" + (cell.cx - 26) + "," + (cell.cy + 4) + ")");
    }

    // gelembung status (judul task dipotong satu baris)
    let text, tone;
    if (agent.state === "working") {
      text = cut(agent.task_title || "bekerja", 22); tone = "working";
    } else if (agent.state === "blocked") {
      text = "butuh keputusan"; tone = "blocked";
    } else if (agent.state === "done") {
      text = "selesai"; tone = "done";
    } else {
      text = "nganggur"; tone = "idle";
    }
    const bw = Math.max(40, Math.min(150, Math.round(text.length * 6.2) + 24));
    cell.bubRect.setAttribute("width", bw);
    cell.bubRect.setAttribute("x", -bw / 2);
    cell.bubRect.setAttribute("class", "bub " + tone);
    cell.bubText.textContent = text;
    cell.bubDot.setAttribute("cx", -bw / 2 + 10);
    cell.bubDot.setAttribute("class", "bubdot " + tone);
  }

  function applyClock(layout) {
    const nowMs = Date.now() + state.serverOffsetMs;
    const d = new Date(nowMs);
    const mins = d.getUTCMinutes() + d.getUTCSeconds() / 60;
    const hours = (d.getUTCHours() % 12) + mins / 60;
    const cxc = layout.W - 30, cyc = 62;
    layout.hourHand.setAttribute("transform", "rotate(" + (hours * 30) + " " + cxc + " " + cyc + ")");
    layout.minHand.setAttribute("transform", "rotate(" + (mins * 6) + " " + cxc + " " + cyc + ")");
    const hh = String(d.getUTCHours()).padStart(2, "0");
    const mm = String(d.getUTCMinutes()).padStart(2, "0");
    layout.clkText.textContent = hh + ":" + mm + " UTC";
  }

  function paintWhiteboard(layout) {
    const c = state.counts || {};
    layout.wbName.textContent = cut(state.boardName || state.slug || "-", 22);
    layout.wbCounts.textContent = cut(
      (Number(c.working_agents) || 0) + " agen kerja · " + (Number(c.idle) || 0) + " nganggur", 27);
    const parts = [];
    if (Number(c.blocked)) parts.push(Number(c.blocked) + " terhenti");
    if (Number(c.done)) parts.push(Number(c.done) + " selesai");
    parts.push((Number(c.running_tasks) || 0) + " jalan");
    layout.wbNote.textContent = cut(parts.join(" · "), 32);
    layout.wbNoteTitle.textContent = "Jalan = task berstatus running di board ini (" +
      (Number(c.running_tasks) || 0) + "); angka lain = jumlah agen/meja.";
  }

  function signature() {
    return state.cols + "|" + state.agents.map((a) => a.profile).join(",");
  }

  function render() {
    const c = cols();
    state.cols = c;
    if (!state.agents.length) {
      $("workspace-room").innerHTML = "";
      const empty = el("div", "empty");
      empty.appendChild(el("b", null, state.slug ? "Belum ada agen di board ini" : "Belum ada board kanban"));
      empty.appendChild(el("div", null, state.slug ? "Profil Hermes akan muncul sebagai meja di sini."
        : "Buat papan dulu lewat `hermes kanban boards create <slug>`."));
      $("workspace-room").appendChild(empty);
      state.layout = null;
      renderLegend();
      renderRoster();
      return;
    }
    if (!state.layout || state.layout.sig !== signature()) {
      state.layout = buildRoom(state.agents, c);
      state.layout.sig = signature();
    }
    for (const agent of state.agents) {
      const cell = state.layout.cells.get(agent.profile);
      if (cell) applyAgent(cell, agent);
    }
    paintWhiteboard(state.layout);
    applyClock(state.layout);
    renderLegend();
    renderRoster();
  }

  function renderLegend() {
    const c = state.counts || {};
    const box = $("legend");
    box.innerHTML = "";
    for (const key of PRIO) {
      const n = key === "working" ? Number(c.working_agents) || 0 : Number(c[key]) || 0;
      if (!n && key !== "working") continue;
      const chip = el("span", "lg");
      const sw = el("span", "sw");
      sw.style.background = stateInfo(key).color;
      chip.appendChild(sw);
      chip.appendChild(el("span", null, stateInfo(key).short + " "));
      chip.appendChild(el("b", null, String(n)));
      box.appendChild(chip);
    }
  }

  function renderRoster() {
    const list = $("rlist");
    list.innerHTML = "";
    const c = state.counts || {};
    $("rosterSum").textContent = state.agents.length
      ? "— " + (Number(c.working_agents) || 0) + " kerja · " + (Number(c.idle) || 0) + " nganggur" +
        (Number(c.blocked) ? " · " + Number(c.blocked) + " terhenti" : "") +
        (Number(c.offline) ? " · " + Number(c.offline) + " offline" : "")
      : "— kosong";
    const sorted = state.agents.slice().sort((a, b) => {
      const d = PRIO.indexOf(a.state) - PRIO.indexOf(b.state);
      return d !== 0 ? d : a.profile.localeCompare(b.profile);
    });
    for (const agent of sorted) {
      const row = el("button", "rrow");
      row.type = "button";
      const info = stateInfo(agent.state);
      const sw = el("span", "sw");
      sw.style.background = info.color;
      row.appendChild(sw);
      const body = el("span", null);
      const head = el("span", null);
      head.appendChild(el("span", "nm", agent.profile));
      head.appendChild(document.createTextNode("  "));
      const stl = el("span", "stl", info.label);
      stl.style.color = info.color;
      head.appendChild(stl);
      body.appendChild(head);
      body.appendChild(el("div", "ttl2", agent.task_title || "(tidak ada task)"));
      row.appendChild(body);
      row.appendChild(el("span", "when", rel(agent.since)));
      row.setAttribute("aria-label", agent.profile + ", status " + info.label +
        (agent.task_title ? ", task " + agent.task_title : "") + ", " +
        (agent.since ? "sejak " + rel(agent.since) : "tanpa aktivitas"));
      row.onclick = () => openSheet(agent.profile, row);
      list.appendChild(row);
    }
  }

  // ---------------- panel bawah ----------------
  const kv = (pairs) => {
    const box = el("div", "kv");
    for (const [k, v] of pairs) {
      if (v === undefined || v === null || v === "") continue;
      const item = el("span");
      item.appendChild(el("span", "k", k + ": "));
      item.appendChild(el("span", null, String(v)));
      box.appendChild(item);
    }
    return box;
  };
  const section = (title) => {
    const sec = el("div", "sec");
    sec.appendChild(el("h3", null, title));
    return sec;
  };

  function openSheet(profile, trigger) {
    const agent = state.agents.filter((a) => a.profile === profile)[0];
    if (!agent) return;
    lastFocus = trigger || null;
    const info = stateInfo(agent.state);
    const body = $("sheetBody");
    body.innerHTML = "";
    $("sheetTitle").textContent = agent.profile;

    const s1 = section("Agent");
    s1.appendChild(kv([
      ["Profil", agent.profile],
      ["Role", agent.role || "(tidak ada deskripsi profil)"],
      ["Status", info.label],
      ["Sejak", agent.since ? rel(agent.since) : "-"],
    ]));
    body.appendChild(s1);

    const s2 = section("Task");
    if (agent.task_id) {
      s2.appendChild(kv([
        ["Judul", agent.task_title || "(tanpa judul)"],
        ["ID", agent.task_id],
        ["Status task", agent.task_status || "-"],
        ["Task jalan", String(agent.tasks_running || 0)],
      ]));
      if (agent.block_kind) s2.appendChild(kv([["Menunggu", agent.block_kind]]));
    } else {
      s2.appendChild(el("div", "muted", "Tidak ada task untuk profil ini di board " + state.slug + "."));
    }
    body.appendChild(s2);

    const s3 = section("Worker");
    s3.appendChild(kv([
      ["PID", agent.worker_pid ? String(agent.worker_pid) : "-"],
      ["Proses", agent.worker_pid ? (agent.worker_alive ? "hidup (/proc ada)" : "tidak ditemukan") : "-"],
      ["Event terakhir", agent.last_event ? agent.last_event.kind + " · " + rel(agent.last_event.at) : ""],
    ]));
    body.appendChild(s3);

    const s4 = section("Aktivitas terakhir");
    if (agent.recent && agent.recent.length) {
      const ul = el("ul", "acts");
      for (const item of agent.recent) {
        const li = el("li", null, item);
        ul.appendChild(li);
      }
      s4.appendChild(ul);
    } else {
      s4.appendChild(el("div", "muted", "Belum ada komentar/event pada task ini."));
    }
    body.appendChild(s4);

    const s5 = section("Tindakan");
    const link = el("a", "linkbtn", "Lihat di Papan →");
    link.href = "/agents?slug=" + encodeURIComponent(state.slug);
    s5.appendChild(link);
    body.appendChild(s5);

    $("sheetWrap").hidden = false;
    $("sheetClose").focus();
  }

  function closeSheet() {
    $("sheetWrap").hidden = true;
    $("sheetBody").innerHTML = "";
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  // ---------------- interaksi ----------------
  $("refresh").onclick = () => refresh(true);
  $("sheetClose").onclick = closeSheet;
  $("sheetBg").onclick = closeSheet;
  $("boardSel").onchange = (e) => {
    state.slug = e.target.value;
    try { localStorage.setItem(LS, state.slug); } catch {}
    state.layout = null;                 // layout bisa beda (jumlah meja)
    refresh(true);
  };
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("sheetWrap").hidden) closeSheet();
  });

  let lastCols = cols();
  window.addEventListener("resize", () => {
    const c = cols();
    if (c !== lastCols) { lastCols = c; state.layout = null; render(); }
  });

  // Polling 3 detik; berhenti saat tab tidak aktif, dan menyegarkan sekali
  // begitu tab kembali terlihat supaya angka tidak tertinggal.
  setInterval(() => { if (!document.hidden) refresh(false); }, POLL_MS);
  setInterval(() => {
    paintStatus();
    if (state.layout) applyClock(state.layout);
    // Jaring pengaman kalau event `resize` tidak sampai (mis. lebar viewport
    // diubah lewat DevTools/emulasi): cek 1x per detik, bangun ulang kalau
    // jumlah kolom meja berubah.
    if (cols() !== state.cols) { state.layout = null; render(); }
  }, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(true); });

  refresh(true);
})();
</script>
</body>
</html>
